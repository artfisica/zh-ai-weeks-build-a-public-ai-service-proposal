<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public AI pour chaque commune — arbre de parcours</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1EC; --panel:#FBFAF7; --white:#FFFFFF; --ink:#1B1A17; --muted:#5A5751; --faint:#7A766E;
    --line:#DDD8CC; --accent:#1F4E8C; --accent-soft:#E7EEF8; --accent-mist:#EEF2F8;
    --done:#2E6A4B; --confirm:#8A5300; --serif:'Fraunces',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
  body.explore{background:var(--accent-mist)}
  button{font:inherit;cursor:pointer}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{position:relative;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:var(--white)}
  .brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
  .right{display:flex;align-items:center;gap:14px}
  .saved-note{font-size:12px;color:var(--muted)}
  .link-btn{border:none;background:none;color:var(--muted);text-decoration:underline;text-decoration-color:#B9B3A5;padding:6px 2px;font-size:12px}
  .conn-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font-size:12px;color:var(--ink)}
  .conn-btn i{width:8px;height:8px;border-radius:50%;background:#B9B3A5;display:inline-block}
  .conn-btn.ok i{background:var(--done)}
  .conn-btn.error i{background:#B4412A}
  .conn-panel{position:absolute;top:60px;right:24px;width:420px;padding:16px;border-radius:12px;background:var(--white);border:1px solid var(--line);box-shadow:0 16px 40px rgba(27,26,23,.14);display:flex;flex-direction:column;gap:10px;z-index:5}
  .conn-panel label{font-size:12px;color:var(--muted)}
  .conn-panel input,.conn-panel select{width:100%;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font:inherit;color:var(--ink);background:var(--white)}
  .conn-panel .caption{font-size:11px;color:var(--muted)}
  .conn-panel .err{font-size:12px;color:#8A3A2A}
  .seg{display:flex;padding:3px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
  .seg button{flex:1;height:32px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-weight:500;font-size:13px}
  .seg button[aria-pressed="true"]{background:var(--white);color:var(--ink)}
  .mode{display:flex;padding:3px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
  .mode button{height:34px;padding:0 14px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-weight:500}
  .mode button[aria-pressed="true"]{background:var(--white);color:var(--ink)}
  .mode button.explore[aria-pressed="true"]{background:var(--accent);color:var(--white)}
  .lang{display:flex;gap:2px;font-size:12px}
  .lang button{height:30px;padding:0 9px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-weight:600}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--white)}

  .layout{display:grid;grid-template-columns:320px minmax(0,1fr) 400px;min-height:calc(100vh - 56px)}
  @media (max-width:1100px){.layout{grid-template-columns:1fr}.story,.detail{border:none;border-bottom:1px solid var(--line)}}

  .story{padding:28px 24px 20px 28px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:18px}
  .eyebrow{font-size:12px;color:var(--muted)}
  body.explore .eyebrow.story-label{color:var(--accent)}
  .sentence{margin:0;font-family:var(--serif);font-size:22px;font-weight:500;line-height:1.55}
  .sentence .fixed{border-bottom:2px solid var(--line);padding-bottom:1px}
  .word{display:inline;padding:0 2px;margin:0;border:none;border-bottom:2px solid #B9B3A5;background:transparent;color:var(--ink);border-radius:3px 3px 0 0}
  .word.pending{border-bottom-style:dashed;border-bottom-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .word.changed{border-bottom-color:var(--accent);color:var(--accent)}
  .word.hyp{border-bottom-style:dashed;border-bottom-color:var(--accent);background:var(--accent-mist);color:var(--accent)}
  .answered{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--muted)}
  .answered b{font-weight:500;color:var(--ink)}
  .hint{font-size:12px;color:var(--muted)}
  .banner{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft)}
  .banner .eyebrow{color:var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;min-height:38px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-weight:500;line-height:1.2}
  .btn.primary{border-color:var(--accent);background:var(--accent);color:var(--white)}
  .btn.ink{border-color:var(--ink)}
  .btn.done{border-color:var(--done);color:var(--done)}
  .spacer{flex:1}
  .note{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;background:var(--white);border:1px dashed #C9D5E8}
  .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
  .who i{width:8px;height:8px;border-radius:50%;background:#B9B3A5;display:inline-block;flex-shrink:0}
  .who.live{color:var(--accent)}
  .who.live i{background:var(--done)}
  .note .err{font-size:12px;color:#8A3A2A}
  .ask{display:flex;flex-direction:column;gap:6px}
  .ask .field{display:flex;gap:8px}
  .ask input{flex:1;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font:inherit;color:var(--ink)}
  .ask input:disabled{border-style:dashed;background:transparent;color:var(--faint)}
  .ask button{width:40px;height:40px;border-radius:8px;border:none;background:var(--accent);color:var(--white);display:flex;align-items:center;justify-content:center}
  .ask button:disabled{background:#B9B3A5;cursor:default}

  .tree{padding:16px 12px 10px;display:flex;flex-direction:column}
  .tree svg{width:100%;height:auto;display:block;overflow:visible}
  .tree text{font-family:var(--sans)}
  .tree .branch-name{font-family:var(--serif)}
  .tree [data-sel]{cursor:pointer}
  .tree [data-sel]:focus-visible circle.core{stroke:var(--ink);stroke-width:3}
  .legend{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;padding-top:6px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--white);border:2px solid #8A867C}
  .dot.done{background:var(--done);border-color:var(--done)}
  .dot.current{border-color:var(--accent)}
  .dot.ghost{border-style:dashed}
  .dot.alt{border-style:dashed;border-color:var(--accent)}
  .dot.changed{background:var(--accent);border-color:var(--accent)}
  @media (prefers-reduced-motion:no-preference){
    .tree path,.tree circle{transition:stroke .25s,fill .25s,stroke-width .25s}
    .tree path.grow{animation:grow .7s ease-out}
    @keyframes grow{from{opacity:0}to{opacity:1}}
  }

  .detail{padding:24px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:14px}
  .detail h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.3}
  .detail .lead{font-size:13px;color:var(--muted);margin:0}
  .pill{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px dashed var(--accent);color:var(--accent);background:var(--white);white-space:nowrap}
  .pill.solid{background:var(--accent);color:var(--white);border-style:solid}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .zone{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:10px;background:var(--white);border:1px solid var(--line)}
  .zone.model{background:var(--accent-mist);border:1px dashed #C9D5E8}
  .zone.alt{border:2px dashed var(--accent)}
  .zone.soft{border-style:dashed}
  .zone-title{font-size:12px;color:var(--faint)}
  .zone.model .zone-title{color:var(--accent)}
  .source{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 8px;margin:0 -8px;border-radius:8px;color:var(--ink);text-decoration:none}
  .source .link{font-size:13px;text-decoration:underline;text-decoration-color:#B9B3A5}
  .also{font-size:12px}
  .badge{flex-shrink:0;padding:3px 7px;border-radius:4px;color:var(--white);font-size:10px;font-weight:600;letter-spacing:.03em}
  .status{display:flex;flex-direction:column;gap:4px;font-size:12px}
  .rv{display:inline-flex;align-items:center;gap:6px;font-weight:500}
  .rv i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
  .cf{color:var(--confirm);font-weight:500}
  .cf b{color:var(--ink);font-weight:400}
  .deps{font-size:12px;color:var(--muted)}
  .before{font-size:12px;color:var(--faint);text-decoration:line-through}
  .small{font-size:12px}
  .caption{font-size:11px;color:var(--muted)}
  .detail input{height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font:inherit;color:var(--ink);width:100%}
  .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
  .foot span{display:inline-flex;align-items:flex-start;gap:6px}
  .foot i{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;margin-top:5px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1F4E8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="3"/><circle cx="21" cy="7" r="3"/><circle cx="14" cy="22" r="3"/><path d="M9 9l5 10M19 9l-5 10"/></svg>
    <span id="brand-text">Public AI pour chaque commune</span>
  </div>
  <div class="right">
    <span class="saved-note" id="saved-note"></span>
    <button type="button" class="link-btn" id="clear-btn"></button>
    <button type="button" class="conn-btn" id="conn-btn" aria-expanded="false"><i></i><span id="conn-label"></span></button>
    <div class="mode" role="group" aria-label="Mode">
      <button type="button" id="mode-situation" aria-pressed="true"></button>
      <button type="button" id="mode-explore" class="explore" aria-pressed="false"></button>
    </div>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" id="lang-fr" aria-pressed="true">FR</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="conn-panel" id="conn-panel" hidden></div>
</header>

<div class="layout">
  <aside class="story" id="story"></aside>
  <main class="tree">
    <svg id="tree" viewBox="0 0 900 860" aria-label="Arbre des pistes"></svg>
    <div class="legend" id="legend"></div>
  </main>
  <aside class="detail" id="detail"></aside>
</div>

<script>
(function () {
  'use strict';
  // Set once after starting the Codespace (proxy/server.js). Leave empty for an offline, portable copy.
  const PUBLIC_PROXY_URL = '';
  const LOCAL_DEV = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);

  const ACCENT = '#1F4E8C', STORE_KEY = 'public-ai-commune.arbre.v4', CONN_KEY = 'public-ai-commune.conn.v4', LANG_KEY = 'public-ai-commune.lang';
  // ---- Language: every visible string is t(french, english) ----
  let LANG = 'fr';
  try { LANG = localStorage.getItem(LANG_KEY) || ((navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'fr'); } catch (e) { /* keep fr */ }
  const t = (fr, en) => LANG === 'en' ? en : fr;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };

  const LV = () => ({ conf: { name: t('Confédération', 'Confederation'), bg: '#2C3140' }, vd: { name: t('Canton de Vaud', 'Canton of Vaud'), bg: '#2E6A4B' }, com: { name: t('Commune', 'Commune'), bg: '#9A452A' } });
  const LABEL = { dest: v => v, tenure: v => v === 'owner' ? t('propriétaire', 'a homeowner') : t('locataire', 'a tenant'), permit: v => t('permis ', 'permit ') + v };
  const LABEL_SHORT = { dest: v => v, tenure: v => v === 'owner' ? t('Propriétaire', 'Homeowner') : t('Locataire', 'Tenant'), permit: v => t('Permis ', 'Permit ') + v };
  const DEP_NAME = () => ({ dest: t('la commune d’arrivée', 'the commune you move to'), tenure: t('votre statut de logement', 'your housing status'), permit: t('votre type de permis', 'your permit type'), answers: t('une réponse que vous avez donnée', 'an answer you gave') });
  const ALT = { dest: v => v === 'Saint-Cergue' ? 'Gland' : 'Saint-Cergue', tenure: v => v === 'owner' ? 'tenant' : 'owner', permit: v => v === 'B' ? 'C' : 'B' };

  // ---- State (persisted in this browser) ----
  const fresh = () => ({ dest: 'Saint-Cergue', tenure: 'owner', permit: 'B' });
  const state = { mode: 'situation', saved: fresh(), explore: fresh(), pending: null, applied: null, answers: [], done: [], hover: null, sel: null, savedAt: null, resumed: false,
    ai: { note: null, explain: {}, busy: false, error: '' } };
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY); if (!raw) return;
      const d = JSON.parse(raw);
      if (d && d.saved) { state.saved = d.saved; state.explore = d.explore || Object.assign({}, d.saved); state.applied = d.applied || null; state.answers = Array.isArray(d.answers) ? d.answers : []; state.done = Array.isArray(d.done) ? d.done : []; state.savedAt = d.savedAt || null; state.resumed = true; }
    } catch (e) { /* storage unavailable */ }
  }
  function persist() {
    state.savedAt = new Date().toISOString();
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ saved: state.saved, explore: state.explore, applied: state.applied, answers: state.answers, done: state.done, savedAt: state.savedAt })); } catch (e) { /* ignore */ }
  }
  const set = (patch, save) => { Object.assign(state, patch); if (save) persist(); render(); };

  // ---- Connection to Apertus through the proxy (the browser never sees a key) ----
  const PRESETS = () => ({
    swisscom: { name: 'Swisscom', base: '', model: '', hint: t('Copiez l’adresse et l’identifiant de modèle depuis le guide Swisscom ; rien n’est prérempli pour ne pas envoyer votre clé au mauvais fournisseur.', 'Copy the address and model id from the Swisscom guide; nothing is prefilled so your key cannot be sent to the wrong provider.') },
    publicai: { name: 'Public AI', base: 'https://api.publicai.co/v1', model: 'swiss-ai/apertus-v1.5-8b', hint: t('Valeurs de platform.publicai.co/docs ; autre modèle possible : swiss-ai/apertus-v1.5-70b.', 'Values from platform.publicai.co/docs; another model: swiss-ai/apertus-v1.5-70b.') },
    other: { name: '', base: '', model: '', hint: t('Toute API compatible chat/completions.', 'Any chat/completions-compatible API.') }
  });
  const conn = Object.assign({ mode: 'proxy', proxyUrl: '', demoToken: '', provider: 'swisscom', base: '', model: '', key: '', status: 'off', error: '', prov: null }, (() => { try { return JSON.parse(sessionStorage.getItem(CONN_KEY) || '{}'); } catch (e) { return {}; } })());
  conn.status = 'off'; conn.prov = null;
  if (!LOCAL_DEV) { conn.mode = 'proxy'; conn.key = ''; conn.demoToken = ''; }
  if (PUBLIC_PROXY_URL) { conn.mode = 'proxy'; conn.proxyUrl = PUBLIC_PROXY_URL; conn.demoToken = ''; }
  const saveConn = () => { try { sessionStorage.setItem(CONN_KEY, JSON.stringify({ mode: conn.mode, proxyUrl: conn.proxyUrl, demoToken: conn.demoToken, provider: conn.provider, base: conn.base, model: conn.model, key: conn.mode === 'direct' ? conn.key : '' })); } catch (e) {} };
  const live = () => conn.status === 'ok';
  const provName = () => conn.prov ? conn.prov.provider : '';
  const provLabel = p => p ? 'Apertus via ' + p.provider + (p.model ? ' (' + String(p.model).split('/').pop() + ')' : '') : t('Texte préparé', 'Prepared text');

  async function chat(messages, maxTokens) {
    let r, j;
    if (conn.mode === 'proxy') {
      r = await fetch(conn.proxyUrl.replace(/\/$/, '') + '/chat', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, conn.demoToken ? { 'X-Demo-Token': conn.demoToken } : {}), body: JSON.stringify({ messages, max_tokens: maxTokens || 400, temperature: 0.2 }) });
    } else {
      r = await fetch(conn.base.replace(/\/$/, '') + '/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + conn.key }, body: JSON.stringify({ model: conn.model, messages, temperature: 0.2, max_tokens: maxTokens || 400 }) });
    }
    if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 401 || r.status === 403 ? t(' (accès refusé)', ' (access refused)') : r.status === 429 ? t(' (limite atteinte)', ' (limit reached)') : ''));
    j = await r.json();
    const text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    const P = PRESETS();
    const prov = j.provenance || { provider: P[conn.provider] ? (P[conn.provider].name || conn.provider) : conn.provider, model: j.model || conn.model };
    return { text, prov };
  }
  async function connect() {
    conn.status = 'testing'; conn.error = ''; conn.prov = null; saveConn(); renderConn();
    try {
      if (conn.mode === 'proxy') {
        if (!conn.proxyUrl) throw new Error(t('adresse du proxy manquante', 'proxy address missing'));
        const r = await fetch(conn.proxyUrl.replace(/\/$/, '') + '/health', { headers: conn.demoToken ? { 'X-Demo-Token': conn.demoToken } : {} });
        let h = null; try { h = await r.json(); } catch (e) { h = null; }
        if (!h) throw new Error('HTTP ' + r.status);
        if (!h.ready) throw new Error(t('le proxy n’est pas prêt', 'the proxy is not ready') + (h.missing && h.missing.length ? ' : ' + h.missing.join(', ') : ''));
        if (h.budget && h.budget.remaining === 0) throw new Error(t('le budget quotidien de la démo est épuisé', 'the daily demo budget is used up'));
        conn.prov = { provider: h.provider || 'proxy', model: h.model || '' };
      } else {
        if (!conn.base || !conn.model || !conn.key) throw new Error(t('adresse, modèle et clé sont requis', 'address, model and key are required'));
        const res = await chat([{ role: 'user', content: 'ping' }], 1);
        conn.prov = res.prov;
      }
      conn.status = 'ok';
    } catch (e) {
      conn.status = 'error';
      conn.error = (e && e.message ? e.message : t('échec', 'failed')) + (String(e).includes('Failed to fetch') ? t(' — le navigateur a bloqué l’appel (CORS ou adresse injoignable).', ' — the browser blocked the call (CORS or unreachable address).') : '');
    }
    renderConn(); render();
  }
  function disconnect() { conn.status = 'off'; conn.error = ''; conn.prov = null; conn.key = ''; saveConn(); state.ai = { note: null, explain: {}, busy: false, error: '' }; renderConn(); render(); }

  // ---- Prepared texts (always available, always labelled as prepared) ----
  function PREPARED_EXPLAIN(key, to) {
    if (key === 'dest') return t('Ce qui change : la commune d’arrivée détermine où votre enfant est scolarisé, quelles taxes communales s’appliquent et quelle ligne vous relie à Nyon. Les démarches à Nyon et l’étape liée au permis n’en dépendent pas. Comparez les coefficients de l’année dans les arrêtés officiels ; ils ne suffisent pas à prédire le montant final de vos impôts.',
      'What changes: the commune you move to determines where your child goes to school, which communal taxes apply and which line connects you to Nyon. The steps in Nyon and the permit step do not depend on it. Compare this year’s coefficients in the official decrees; on their own they do not predict your final tax bill.');
    if (key === 'tenure') return to === 'tenant' ? t('Ce qui change : locataire, vous n’avez rien à vendre ; la question devient le délai de résiliation et le nouveau bail.', 'What changes: as a tenant you have nothing to sell; the question becomes the notice period and the new lease.')
      : t('Ce qui change : propriétaire, le départ de Nyon implique une vente ou une mise en location, avec un impôt cantonal sur le gain immobilier.', 'What changes: as a homeowner, leaving Nyon means selling or letting, with a cantonal tax on the property gain.');
    return t('Ce qui change : la démarche communale est la même pour un permis B et un permis C. Ce qui diffère est la validité de votre autorisation, et donc ce qu’il faut vérifier au moment d’un renouvellement. La validité d’un permis B dépend de votre nationalité.',
      'What changes: the communal procedure is the same for a B and a C permit. What differs is how long your authorisation is valid, and therefore what to check at renewal. A B permit’s validity depends on your nationality.');
  }
  const review = r => r === null ? { text: t('Source officielle (fédérale ou cantonale)', 'Official source (federal or cantonal)'), color: ACCENT }
    : (r ? { text: t('Relu par ', 'Reviewed by ') + r, color: '#2E6A4B' } : { text: t('Page officielle reliée ; relecture communale en attente', 'Official page linked; commune review pending'), color: '#7A766E' });

  // ---- Answers and done-marks belong to the scenario that produced them ----
  const scopeFor = (card, P) => { const s = {}; (card.deps || []).filter(k => k !== 'answers').forEach(k => { s[k] = P[k]; }); return s; };
  const scopeMatches = (scope, P) => Object.keys(scope).every(k => P[k] === scope[k]);

  // ---- Diff by id ----

    if (lines.length) html += '<p class="answered">' + lines.join(' ') + '</p>';
    const dormant = s.answers.filter(a => !scopeMatches(a.scope || {}, d.params)).length + s.done.filter(x => !scopeMatches(x.scope || {}, d.params)).length;
    if (dormant) html += '<div class="hint">' + (LANG === 'en' ? dormant + (dormant > 1 ? ' answers given in another scenario are set aside' : ' answer given in another scenario is set aside') + '; they return if you go back.' : dormant + (dormant > 1 ? ' éléments donnés dans un autre scénario sont mis de côté' : ' élément donné dans un autre scénario est mis de côté') + ' ; ils reviendront si vous y revenez.') + '</div>';

    if (d.previewOn) {
      const c = countAffected(d), parts = [];
      if (c.affected) parts.push(plural(c.affected, 'étape changerait', 'étapes changeraient', 'step would change', 'steps would change'));
      if (c.added) parts.push(plural(c.added, 'étape apparaîtrait', 'étapes apparaîtraient', 'step would appear', 'steps would appear'));

      html += '<div class="banner"><div class="eyebrow">' + t('Proposition, rien n’est appliqué', 'Proposal, nothing is applied') + '</div><div class="small">' + t('La branche « ', 'The “') + esc(toLabel) + t(' » pousse en pointillé : ', '” branch grows dashed: ') + parts.join(', ') + t(' dans ', ' in ') + plural(c.lanes, 'piste', 'pistes', 'branch', 'branches') + '. ' + c.unaffected + t(' étapes et ', ' steps and ') + c.ghosts + t(' questions en attente ne bougent pas.', ' open questions do not move.') + '</div>' +

        '<div class="row"><button type="button" class="btn" data-action="reset-explore">' + t('Repartir de ma situation', 'Start again from my situation') + '</button><button type="button" class="btn primary" data-action="mode-situation">' + t('Revenir à ma situation', 'Back to my situation') + '</button></div></div>';
    }
    let note, prov = null;
    if (d.exploreOn) note = t('Mode exploration : vous regardez « ', 'Explore mode: you are looking at “') + s.explore.dest + ', ' + LABEL_SHORT.tenure(s.explore.tenure).toLowerCase() + ', ' + LABEL.permit(s.explore.permit) + t(' ». Votre parcours enregistré (', '”. Your saved path (') + savedSummary + t(') n’est pas modifié.', ') is untouched.');

  // ---- Tree ----
  function renderTree(d) {
    const s = state;
    let out = '';
    d.rows.forEach((row, li) => {
      const l = row.lane, y = YS[li], n = row.cmp.length;
      const pts = row.cmp.map((c, i) => ({ x: X0 + i * XSTEP, y: y + (WOB[li][i] || 0) }));
      const hl = s.hover === l.id || (s.sel && s.sel.li === li);
      const mainPts = row.cmp.map((c, i) => c.kind === 'added' ? null : pts[i]).filter(Boolean);
      const laneAffected = row.cmp.some(c => c.kind === 'changed' || c.kind === 'added' || c.kind === 'removed');
      const laneApplied = row.cmp.some(c => c.kind.indexOf('applied-') === 0);
      out += '<g data-lane="' + l.id + '">';
      out += '<path d="' + pathThrough(ROOT, mainPts, X0 + (n - 1) * XSTEP + 40) + '" fill="none" stroke="' + (hl ? '#1B1A17' : (d.exploreOn ? '#8FA8CC' : '#C9C2B2')) + '" stroke-width="' + (hl ? 3 : 2.5) + '" stroke-linecap="round"' + (d.exploreOn ? ' stroke-dasharray="10 6"' : '') + '/>';
      if (laneAffected) {
        const first = row.cmp.findIndex(c => c.kind !== 'same');
        const start = first === 0 ? ROOT : pts[first - 1];
        const route = [];
        for (let i = first; i < n; i++) { const k = row.cmp[i].kind; if (k === 'removed') continue; route.push({ x: pts[i].x, y: k === 'same' ? pts[i].y : pts[i].y + 48 }); }
        out += '<path class="grow" d="' + pathThrough(start, route, null) + '" fill="none" stroke="' + ACCENT + '" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/>';
      }
      const tag = d.previewOn ? (laneAffected ? t('changerait', 'would change') : t('ne bouge pas', 'does not move')) : (d.prevLanes ? (laneApplied ? t('recalculée', 'recalculated') : t('inchangée', 'unchanged')) : '');
      const lastY = pts[n - 1].y;
      const nameX = X0 + (n - 1) * XSTEP + 52;
      out += '<text class="branch-name" x="' + nameX + '" y="' + (lastY + 5) + '" text-anchor="start" font-size="16" font-weight="600" fill="' + (hl ? '#1B1A17' : '#3E3B35') + '">' + esc(l.name) + '</text>';
      if (tag) out += '<text x="' + nameX + '" y="' + (lastY + 20) + '" text-anchor="start" font-size="10" fill="' + ((laneAffected || laneApplied) ? ACCENT : '#7A766E') + '">' + esc(tag) + '</text>';
      row.cmp.forEach((c, i) => {
        const p = pts[i], k = c.kind;
        if (k !== 'added') {
          const card = c.a;
          const changed = k === 'applied-changed' || k === 'applied-added';
          const done = !card.ghost && isDone(card, d.params), current = !card.ghost && row.currentId === card.id;
          const selected = s.sel && s.sel.li === li && s.sel.id === c.id && !s.sel.alt;
          const fill = card.ghost ? '#FFFFFF' : (changed ? ACCENT : (done ? '#2E6A4B' : '#FFFFFF'));
          const stroke = card.ghost ? '#8A867C' : (changed ? '#FFFFFF' : (done ? '#2E6A4B' : (current ? ACCENT : '#8A867C')));
          const removed = k === 'removed';
          out += '<g data-sel="' + li + '|' + esc(c.id) + '|0" tabindex="0" role="button" aria-label="' + esc(card.ghost ? t('Question : ', 'Question: ') + card.title : card.title) + '"' + (removed ? ' opacity="0.55"' : '') + '>';
          if (selected) out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="19" fill="none" stroke="#1B1A17" stroke-width="1.5" stroke-dasharray="3 3"/>';
          if (k === 'changed' || removed) out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="16" fill="' + ACCENT + '" opacity="0.14"/>';
          out += '<circle class="core" cx="' + p.x + '" cy="' + p.y + '" r="10" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + (current || changed ? 3 : 2) + '"' + (card.ghost ? ' stroke-dasharray="3 3"' : '') + '/>';
          if (done && !changed) out += '<path d="M ' + (p.x - 4.5) + ' ' + p.y + ' l 3 3 l 6 -6.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
          if (card.ghost) out += '<text x="' + p.x + '" y="' + (p.y + 4) + '" text-anchor="middle" font-size="12" font-weight="600" fill="#8A867C">?</text>';
          out += '<text x="' + p.x + '" y="' + (p.y - 17) + '" text-anchor="middle" font-size="12" font-weight="' + (hl || current ? 600 : 500) + '" fill="' + (d.exploreOn ? '#3A4A63' : '#1B1A17') + '"' + (removed ? ' text-decoration="line-through"' : '') + '>' + esc(card.short) + '</text>';
          const sub = k === 'changed' ? t('changerait', 'would change') : removed ? t('disparaîtrait', 'would disappear') : k === 'applied-changed' ? t('modifiée', 'modified') : k === 'applied-added' ? t('ajoutée', 'added') : done ? t('faite', 'done') : current ? t('prochaine étape', 'next step') : '';
          if (sub) out += '<text x="' + p.x + '" y="' + (p.y + 26) + '" text-anchor="middle" font-size="10" fill="' + (done && k === 'same' ? '#2E6A4B' : ACCENT) + '">' + esc(sub) + '</text>';
          out += '</g>';
        }
        if (k === 'changed' || k === 'added') {
          const ay = p.y + 48, alt = c.b;
          const selA = s.sel && s.sel.li === li && s.sel.id === c.id && s.sel.alt;
          out += '<g data-sel="' + li + '|' + esc(c.id) + '|1" tabindex="0" role="button" aria-label="' + esc(t('Version proposée : ', 'Proposed version: ') + alt.title) + '">';
          if (selA) out += '<circle cx="' + p.x + '" cy="' + ay + '" r="19" fill="none" stroke="' + ACCENT + '" stroke-width="1.5" stroke-dasharray="3 3"/>';
          out += '<circle class="core" cx="' + p.x + '" cy="' + ay + '" r="10" fill="#FFFFFF" stroke="' + ACCENT + '" stroke-width="2.5" stroke-dasharray="4 3"/>';
          if (alt.ghost) out += '<text x="' + p.x + '" y="' + (ay + 4) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + ACCENT + '">?</text>';
          out += '<text x="' + p.x + '" y="' + (ay + 26) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + ACCENT + '">' + esc(alt.short) + (k === 'added' ? t(' (nouvelle)', ' (new)') : '') + '</text></g>';
        }
      });
      out += '</g>';
    });
    out += '<circle cx="36" cy="440" r="17" fill="#1B1A17"/><circle cx="36" cy="440" r="6" fill="#FFFFFF"/><text x="36" y="478" text-anchor="middle" font-size="10" fill="#5A5751">' + t('Vous', 'You') + '</text>';
    document.getElementById('tree').innerHTML = out;
    document.getElementById('legend').innerHTML =
      '<span><i class="dot done"></i>' + t('Faite (marquée par vous)', 'Done (marked by you)') + '</span><span><i class="dot current"></i>' + t('Prochaine étape', 'Next step') + '</span><span><i class="dot"></i>' + t('À venir', 'Ahead') + '</span><span><i class="dot ghost"></i>' + t('Question en attente', 'Open question') + '</span><span><i class="dot alt"></i>' + t('Branche proposée', 'Proposed branch') + '</span><span><i class="dot changed"></i>' + t('Modifiée ou ajoutée', 'Modified or added') + '</span>';
  }

  // ---- Detail ----
  function sourceBlock(card) {
    const lv = LV()[card.src.lv], rv = review(card.src.reviewed);
    return '<div class="zone' + (card.src.exact ? '' : ' soft') + '"><div class="zone-title">' + (card.src.exact ? t('Ce que la source établit', 'What the source establishes') : t('Où vérifier — site officiel, page précise encore à relier', 'Where to check — official site, exact page still to be linked')) + '</div>' +
      '<a class="source" href="' + esc(card.src.url) + '" target="_blank" rel="noopener"><span class="badge" style="background:' + lv.bg + '">' + esc(lv.name) + '</span><span class="link">' + esc(card.src.title) + '</span></a>' +
      (card.also ? [].concat(card.also).map(a => '<div class="also">' + t('Voir aussi : ', 'See also: ') + '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a></div>').join('') : '') +
      '<div class="status"><span class="rv" style="color:' + rv.color + '"><i></i>' + esc(rv.text) + '</span>' +

  }
  const depsLine = card => { const DN = DEP_NAME(); return card.deps && card.deps.length ? '<div class="deps">' + t('Dépend de ', 'Depends on ') + card.deps.map(k => DN[k]).join(t(' et de ', ' and ')) + '.</div>' : '<div class="deps">' + t('Ne dépend d’aucune de vos réponses : cette étape reste dans tous les scénarios.', 'Depends on none of your answers: this step stays in every scenario.') + '</div>'; };
  const modelZone = (title, body, prov) => '<div class="zone model"><div class="zone-title">' + esc(title) + '</div>' + whoLine(prov) + body + '</div>';

  function renderDetail(d) {
    const s = state;

    let html;

      document.getElementById('detail').innerHTML = html + foot; return;
    }
    const lane = row.lane;
    const viewingAlt = !!(s.sel.alt && cmp.b);
    const showing = viewingAlt ? cmp.b : cmp.a;
    const other = viewingAlt ? cmp.a : (d.previewOn ? cmp.b : null);
    const fromLabel = s.pending ? LABEL_SHORT[s.pending.key](s.pending.from) : '';
    const toLabel = s.pending ? LABEL_SHORT[s.pending.key](s.pending.to) : '';
    if (showing.ghost) {
      html = '<div class="eyebrow">' + esc(lane.name) + t(', question en attente', ', open question') + '</div><h2>' + esc(showing.title) + '</h2>' + modelZone(t('Pourquoi cette question', 'Why this question'), '<div>' + esc(showing.ghostWhy) + '</div>', null);
      if (showing.answer.type === 'yesno') html += '<div class="row"><button type="button" class="btn" data-answer="' + esc(showing.id) + '" data-value="oui">' + t('Oui', 'Yes') + '</button><button type="button" class="btn" data-answer="' + esc(showing.id) + '" data-value="non">' + t('Non', 'No') + '</button></div>';
      else if (showing.answer.type === 'choice') html += '<div class="row">' + showing.answer.options.map((o, i) => '<button type="button" class="btn" data-answer="' + esc(showing.id) + '" data-value="' + esc(o) + '">' + esc((showing.answer.labels || showing.answer.options)[i]) + '</button>').join('') + '</div>';
      else html += '<form data-answer-form="' + esc(showing.id) + '" style="display:flex;flex-direction:column;gap:8px"><label for="answer" class="hint">' + t('Votre réponse', 'Your answer') + '</label><input id="answer" name="answer" type="text" placeholder="' + esc(showing.answer.placeholder || '') + '" autocomplete="off"><button type="submit" class="btn primary">' + t('Répondre et faire pousser la branche', 'Answer and grow the branch') + '</button></form>';
      const sc = scopeFor(showing, d.params), scKeys = Object.keys(sc);
      html += '<p class="lead">' + (scKeys.length ? t('Cette réponse vaut pour le scénario « ', 'This answer holds for the scenario “') + scKeys.map(k => LABEL_SHORT[k](sc[k])).join(', ') + t(' » ; si vous changez cela, elle est mise de côté, pas perdue.', '”; if you change that, it is set aside, not lost.') : t('Cette réponse vaut dans tous les scénarios.', 'This answer holds in every scenario.')) + t(' Elle s’enregistre dans ce navigateur.', ' It is saved in this browser.') + '</p>';
      document.getElementById('detail').innerHTML = html + foot; return;
    }
    const k = cmp.kind;
    const changed = k === 'applied-changed' || k === 'applied-added';
    const prevCard = (changed && d.prevLanes) ? (d.prevLanes[s.sel.li].cards.find(c => c.id === cmp.id) || null) : null;
    const done = !viewingAlt && isDone(showing, d.params), current = !viewingAlt && row.currentId === showing.id;
    const status = viewingAlt ? (k === 'added' ? t('nouvelle étape proposée', 'new proposed step') : t('version proposée', 'proposed version')) : (done ? t('faite', 'done') : (current ? t('prochaine étape', 'next step') : t('à venir', 'ahead')));
    const pill = viewingAlt ? '<span class="pill">' + (k === 'added' ? t('Apparaîtrait', 'Would appear') : t('Proposée', 'Proposed')) + '</span>' : k === 'applied-changed' ? '<span class="pill solid">' + t('Modifiée', 'Modified') + '</span>' : k === 'applied-added' ? '<span class="pill solid">' + t('Ajoutée', 'Added') + '</span>' : d.exploreOn ? '<span class="pill">' + t('Hypothèse', 'Hypothesis') + '</span>' : k === 'changed' ? '<span class="pill">' + t('Changerait', 'Would change') + '</span>' : k === 'removed' ? '<span class="pill">' + t('Disparaîtrait', 'Would disappear') + '</span>' : '';
    html = '<div class="head"><div class="eyebrow">' + esc(lane.name) + ', ' + status + '</div>' + pill + '</div><h2>' + esc(showing.title) + '</h2>';
    html += sourceBlock(showing);
    html += modelZone(t('Explication de l’étape', 'Explanation of the step'), '<div>' + esc(showing.why) + '</div>' + depsLine(showing) + (changed ? '<div class="before">' + t('Avant : ', 'Before: ') + esc(prevCard ? (prevCard.ghost ? t('question en attente', 'open question') : prevCard.title) : t('cette étape n’existait pas', 'this step did not exist')) + '</div><div class="small">' + esc(appliedExplanation(d)) + '</div>' : ''), null);
    if (!viewingAlt && !d.previewOn) {
      const sc = scopeFor(showing, d.params), scKeys = Object.keys(sc);
      html += '<div class="row"><button type="button" class="btn ' + (done ? 'done' : '') + '" data-done="' + esc(showing.id) + '">' + (done ? t('Faite — la remettre à faire', 'Done — mark as not done') : t('Je l’ai faite', 'I have done this')) + '</button></div><div class="caption">' + (scKeys.length ? t('Ce marquage vaut pour « ', 'This mark holds for “') + scKeys.map(kk => LABEL_SHORT[kk](sc[kk])).join(', ') + t(' » : changer cela le met de côté.', '”: changing that sets it aside.') : t('Ce marquage vaut dans tous les scénarios.', 'This mark holds in every scenario.')) + t(' Rien n’est marqué à votre place.', ' Nothing is marked on your behalf.') + '</div>';
    }
    if ((d.previewOn && k !== 'same' && k !== 'removed') || (viewingAlt && other)) {
      const c = countAffected(d), ex = explanation(d);
      html += '<div class="zone alt"><div class="zone-title" style="color:var(--accent)">' + (viewingAlt ? (other ? t('Version enregistrée, ', 'Saved version, ') + esc(fromLabel) : t('Aujourd’hui : cette étape n’existe pas', 'Today: this step does not exist')) : (other ? t('Version proposée, ', 'Proposed version, ') + esc(toLabel) : t('Proposition', 'Proposal'))) + '</div>';
      if (other) {
        if (other.ghost) html += '<div style="font-weight:600">' + t('Question en attente : ', 'Open question: ') + esc(other.title) + '</div><div class="small" style="color:var(--faint)">' + t('Aucune source encore ; en attente de votre réponse.', 'No source yet; waiting for your answer.') + '</div>';
        else { const lv = LV()[other.src.lv], rv = review(other.src.reviewed); html += '<div style="font-weight:600;font-size:15px">' + esc(other.title) + '</div><a class="source" href="' + esc(other.src.url) + '" target="_blank" rel="noopener"><span class="badge" style="background:' + lv.bg + '">' + esc(lv.name) + '</span><span class="link">' + esc(other.src.title) + '</span></a><span class="rv" style="color:' + rv.color + ';font-size:12px"><i></i>' + esc(rv.text) + '</span>' + (other.src.exact ? '' : '<span class="caption">' + t('Site officiel ; page précise encore à relier.', 'Official site; exact page still to be linked.') + '</span>'); }
      }
      html += modelZone(t('Ce qui change', 'What changes'), '<div class="small">' + esc(ex.text) + '</div>', ex.prov);
      html += '<div class="row"><button type="button" class="btn ink" data-action="keep">' + t('Garder ', 'Keep ') + esc(fromLabel) + '</button><button type="button" class="btn primary" data-action="adopt">' + t('Adopter ', 'Adopt ') + esc(toLabel) + t(' partout (', ' everywhere (') + c.total + t(' étapes)', ' steps)') + '</button></div><div class="caption">' + t('Adopter applique « ', 'Adopt applies “') + esc(toLabel) + t(' » à toutes les branches en pointillé, pas seulement à celle-ci.', '” to every dashed branch, not only this one.') + '</div></div>';
    }
    if (k === 'removed') { const ex = explanation(d); html += '<div class="zone alt"><div class="zone-title" style="color:var(--accent)">' + t('Dans « ', 'In “') + esc(toLabel) + t(' », cette étape n’existe plus', '”, this step no longer exists') + '</div>' + whoLine(ex.prov) + '<div class="small">' + esc(ex.text) + '</div></div>'; }
    document.getElementById('detail').innerHTML = html + foot;
  }

  function renderConn() {
    const btn = document.getElementById('conn-btn'), label = document.getElementById('conn-label'), panel = document.getElementById('conn-panel');
    btn.className = 'conn-btn ' + (conn.status === 'ok' ? 'ok' : conn.status === 'error' ? 'error' : '');
    label.textContent = conn.status === 'ok' ? 'Apertus via ' + provName() + (conn.prov && conn.prov.model ? ' (' + String(conn.prov.model).split('/').pop() + ')' : '') : conn.status === 'testing' ? t('Connexion…', 'Connecting…') : conn.status === 'error' ? ((PUBLIC_PROXY_URL && !LOCAL_DEV) ? t('Apertus indisponible pour l’instant', 'Apertus unavailable for now') : t('Connexion échouée', 'Connection failed')) : t('Apertus non connecté', 'Apertus not connected');
    if (panel.hidden) return;
    const PS = PRESETS(), P = PS[conn.provider] || PS.other;
    let html = '<div style="font-weight:600">' + t('Connecter Apertus', 'Connect Apertus') + '</div>' +
      (LOCAL_DEV ? '<div class="seg" role="group"><button type="button" data-conn="mode-proxy" aria-pressed="' + (conn.mode === 'proxy') + '">' + t('Par un proxy (recommandé)', 'Through a proxy (recommended)') + '</button><button type="button" data-conn="mode-direct" aria-pressed="' + (conn.mode === 'direct') + '">' + t('Direct (développement local)', 'Direct (local development)') + '</button></div>' : '');
    if (conn.mode === 'proxy') {
      html += (PUBLIC_PROXY_URL && !LOCAL_DEV ? '<div class="caption">' + t('La connexion publique est configurée. Si elle est indisponible, le parcours et les liens restent accessibles.', 'The public connection is configured. If it is unavailable, the journey and the links remain available.') + '</div>'
        : '<label for="c-proxy">' + t('Adresse du proxy', 'Proxy address') + '</label><input id="c-proxy" value="' + esc(conn.proxyUrl) + '" placeholder="https://…-8787.app.github.dev">' +
          '<label for="c-token">' + t('Jeton de démo (facultatif ; laissez vide pour la démo publique)', 'Demo token (optional; leave empty for the public demo)') + '</label><input id="c-token" type="password" value="' + esc(conn.demoToken) + '" autocomplete="off">') +
        '<div class="caption">' + t('Le proxy garde la clé côté serveur, tient un budget quotidien et renvoie la provenance des réponses générées.', 'The proxy keeps the key server-side, holds a daily budget and returns the provenance of generated answers.') + '</div>';
    } else {
      html += '<label for="c-provider">' + t('Fournisseur', 'Provider') + '</label><select id="c-provider"><option value="swisscom"' + (conn.provider === 'swisscom' ? ' selected' : '') + '>Swisscom (Swiss AI Platform)</option><option value="publicai"' + (conn.provider === 'publicai' ? ' selected' : '') + '>Public AI Inference Utility</option><option value="other"' + (conn.provider === 'other' ? ' selected' : '') + '>' + t('Autre API compatible', 'Other compatible API') + '</option></select>' +
        '<div class="caption">' + esc(P.hint) + '</div>' +
        '<label for="c-base">' + t('Adresse de l’API (base, avant /chat/completions)', 'API address (base, before /chat/completions)') + '</label><input id="c-base" value="' + esc(conn.base) + '" placeholder="' + esc(P.base || 'https://…/v1') + '">' +
        '<label for="c-model">' + t('Identifiant de modèle', 'Model id') + '</label><input id="c-model" value="' + esc(conn.model) + '" placeholder="' + esc(P.model || 'apertus-…') + '">' +
        '<label for="c-key">' + t('Clé API', 'API key') + '</label><input id="c-key" type="password" value="' + esc(conn.key) + '" autocomplete="off">' +
        '<div class="caption">' + t('Mode local seulement : la clé reste dans cet onglet mais tout script de la page peut la lire.', 'Local mode only: the key stays in this tab but any script on the page can read it.') + '</div>';
    }
    if (conn.error) html += '<div class="err">' + esc(conn.error) + '</div>';
    html += '<div class="row"><button type="button" class="btn" data-conn="close">' + t('Fermer', 'Close') + '</button>' + (conn.status === 'ok' ? '<button type="button" class="btn ink" data-conn="off">' + t('Déconnecter', 'Disconnect') + '</button>' : '') + '<button type="button" class="btn primary" data-conn="go">' + (conn.status === 'ok' ? t('Reconnecter', 'Reconnect') : t('Connecter', 'Connect')) + '</button></div>';
    panel.innerHTML = html;
  }
  function readConnForm() {
    if (conn.mode === 'proxy') { const el = document.getElementById('c-proxy'); if (el) conn.proxyUrl = el.value.trim(); const tk = document.getElementById('c-token'); if (tk) conn.demoToken = tk.value.trim(); }
    else {
      const prov = document.getElementById('c-provider'), b = document.getElementById('c-base'), m = document.getElementById('c-model'), key = document.getElementById('c-key');
      if (prov) conn.provider = prov.value; if (b) conn.base = b.value.trim(); if (m) conn.model = m.value.trim(); if (key) conn.key = key.value.trim();
    }
    saveConn();
  }

  function renderChrome() {
    document.documentElement.lang = LANG;
    document.title = t('Public AI pour chaque commune — arbre de parcours', 'Public AI for every commune — journey tree');
    document.getElementById('brand-text').textContent = t('Public AI pour chaque commune', 'Public AI for every commune');
    document.getElementById('clear-btn').textContent = t('Effacer mon parcours', 'Clear my path');
    document.getElementById('mode-situation').textContent = t('Ma situation', 'My situation');
    document.getElementById('mode-explore').textContent = t('Explorer', 'Explore');
    document.getElementById('lang-fr').setAttribute('aria-pressed', String(LANG === 'fr'));
    document.getElementById('lang-en').setAttribute('aria-pressed', String(LANG === 'en'));
  }
  function render() {
    const d = derive();
    renderChrome();
    document.body.classList.toggle('explore', d.exploreOn);
    document.getElementById('mode-situation').setAttribute('aria-pressed', String(!d.exploreOn));
    document.getElementById('mode-explore').setAttribute('aria-pressed', String(d.exploreOn));
    document.getElementById('saved-note').textContent = state.savedAt ? t('Enregistré dans ce navigateur, ', 'Saved in this browser, ') + new Date(state.savedAt).toLocaleString(LANG === 'en' ? 'en-GB' : 'fr-CH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : t('Rien n’est encore enregistré', 'Nothing saved yet');
    renderStory(d); renderTree(d); renderDetail(d);
  }
  function setLang(l) { LANG = l; try { localStorage.setItem(LANG_KEY, l); } catch (e) {} state.ai.note = null; renderConn(); render(); }

  // ---- Apertus tasks (only when connected; each result carries its provenance) ----
  const langName = () => LANG === 'en' ? 'English' : 'français';
  async function askExplain() {
    const s = state; if (!live() || !s.pending) return;
    const d = derive(); const id = d.diffKey; if (!id || s.ai.explain[id]) return;
    state.ai.busy = true; state.ai.error = ''; render();
    const DN = DEP_NAME();
    try {
      const res = await chat([
        { role: 'system', content: LANG === 'en'
          ? 'You are the guide of a Swiss public service. In English, in at most two sentences, explain what changes in a person’s journey when one of their answers changes. Rely only on the list provided; invent no rule, deadline or amount. End with “To confirm with” followed by the most relevant authority among those cited.'
          : 'Tu es le guide d’un service public suisse. Tu expliques, en français, en deux phrases au plus, ce qui change dans le parcours d’une personne quand une de ses réponses change. Appuie-toi uniquement sur la liste fournie ; n’invente aucune règle, aucun délai, aucun montant. Termine par « À vérifier auprès de » suivi de l’autorité la plus pertinente parmi celles citées.' },
        { role: 'user', content: (LANG === 'en' ? 'Changed answer: ' : 'Réponse modifiée : ') + DN[s.pending.key] + ', ' + LABEL[s.pending.key](s.pending.from) + ' → ' + LABEL[s.pending.key](s.pending.to) + '. ' + (LANG === 'en' ? 'Situation: ' : 'Situation : ') + JSON.stringify(d.params) + '. ' + (LANG === 'en' ? 'Changes computed by the application: ' : 'Changements calculés par l’application : ') + JSON.stringify(diffSummary(d)) }
      ], 220);
      if (res.text.trim()) state.ai.explain[id] = { text: res.text.trim(), prov: res.prov };
    } catch (e) { state.ai.error = t('Apertus n’a pas répondu (', 'Apertus did not answer (') + (e && e.message ? e.message : t('erreur', 'error')) + t(') ; texte préparé affiché.', '); prepared text shown.'); }
    state.ai.busy = false; render();
  }
  async function readStory(text) {
    const s = state; if (!live() || !text.trim()) return;
    const d = derive();
    state.ai.busy = true; state.ai.error = ''; render();
    const schema = '{"dest":"Saint-Cergue"|"Gland"|null,"tenure":"owner"|"tenant"|null,"permit":"B"|"C"|null,"answers":{"q.nationalite":"UE/AELE"|"État tiers"|null,"q.travail":string|null,"q.residence-secondaire":"oui"|"non"|null,"q.bail-signe":"oui"|"non"|null,"q.parascolaire":"oui"|"non"|null},"note":string}';
    try {
      const res = await chat([
        { role: 'system', content: 'You read a sentence a person adds to their story and return ONLY a JSON object of the form ' + schema + '. Use null for anything the sentence does not state explicitly. A nationality of an EU or EFTA country → q.nationalite "UE/AELE"; any other nationality → "État tiers". Yes/no answers use "oui"/"non". "note": one sentence in ' + langName() + ' saying what you understood. No text outside the JSON.' },
        { role: 'user', content: 'Current situation: ' + JSON.stringify(d.params) + '. Sentence: ' + text }
      ], 300);
      const j = JSON.parse(res.text.replace(/```json|```/g, '').trim());
      const applied = [];
      const okv = { dest: ['Saint-Cergue', 'Gland'], tenure: ['owner', 'tenant'], permit: ['B', 'C'] };
      const allowed = { 'q.nationalite': ['UE/AELE', 'État tiers'], 'q.residence-secondaire': ['oui', 'non'], 'q.bail-signe': ['oui', 'non'], 'q.parascolaire': ['oui', 'non'] };
      const open = d.lanes.flatMap(l => l.cards).filter(c => c.ghost);
      Object.keys(j.answers || {}).forEach(id => {
        const v = j.answers[id]; if (v === null || v === undefined || v === '') return;
        if (allowed[id] && !allowed[id].includes(v)) return;
        const q = open.find(c => c.id === id); if (!q) return;
        storeAnswer(q, String(v), d.params); applied.push(q.short + ' → ' + v);
      });
      let pendingKey = null;
      ['dest', 'tenure', 'permit'].forEach(key => { const v = j[key]; if (v && okv[key].includes(v) && v !== d.params[key] && !pendingKey) pendingKey = key; });
      const DN = DEP_NAME();
      state.ai.note = { text: (j.note ? String(j.note) + ' ' : '') + (applied.length ? t('Réponses retenues : ', 'Answers kept: ') + applied.join(' ; ') + '.' : '') + (pendingKey ? t(' Un changement de ', ' A change of ') + DN[pendingKey] + t(' est proposé ci-dessus ; rien n’est appliqué sans vous.', ' is proposed above; nothing is applied without you.') : ''), prov: res.prov };
      if (pendingKey) { if (d.exploreOn) { const e = Object.assign({}, s.explore); e[pendingKey] = j[pendingKey]; state.explore = e; } else state.pending = { key: pendingKey, from: d.params[pendingKey], to: j[pendingKey] }; }
      persist();
    } catch (e) { state.ai.error = t('Apertus n’a pas renvoyé de réponse exploitable (', 'Apertus did not return a usable answer (') + (e && e.message ? e.message : t('erreur', 'error')) + ').'; }
    state.ai.busy = false; state.sel = null; render();
    if (state.pending) askExplain();
  }

  // ---- Interactions ----
  function act(action) {
    const s = state, d = derive();
    if (action === 'keep') set({ pending: null, sel: null });
    else if (action === 'adopt') set({ saved: d.candParams, explore: Object.assign({}, d.candParams), applied: { prev: s.saved }, pending: null, sel: null, resumed: false }, true);
    else if (action === 'reset-explore') set({ explore: Object.assign({}, s.saved), sel: null }, true);
    else if (action === 'mode-situation') set({ mode: 'situation', sel: null });
    else if (action === 'mode-explore') set({ mode: 'explore', pending: null, sel: null });
    else if (action === 'clear') { try { localStorage.removeItem(STORE_KEY); } catch (e) {} set({ mode: 'situation', saved: fresh(), explore: fresh(), pending: null, applied: null, answers: [], done: [], sel: null, savedAt: null, resumed: false, ai: { note: null, explain: {}, busy: false, error: '' } }); }
  }
  function toggleWord(key) {
    const s = state, d = derive();
    if (d.exploreOn) { const e = Object.assign({}, s.explore); e[key] = ALT[key](e[key]); set({ explore: e, sel: null }, true); return; }
    const v = s.saved[key], pend = s.pending && s.pending.key === key;
    set({ pending: pend ? null : { key, from: v, to: ALT[key](v) }, sel: null });
    if (state.pending) askExplain();
  }
  function storeAnswer(q, value, P) {
    const scope = scopeFor(q, P);
    state.answers = state.answers.filter(a => !(a.id === q.id && JSON.stringify(a.scope || {}) === JSON.stringify(scope))).concat([{ id: q.id, value, scope }]);
  }
  function answer(id, value) {
    const d = derive(); value = String(value).trim(); if (!value) return;
    const q = d.lanes.flatMap(l => l.cards).find(c => c.id === id && c.ghost); if (!q) return;
    storeAnswer(q, value, d.params);
    set({ sel: null }, true);
  }
  function toggleDone(id) {
    const d = derive();
    const card = d.lanes.flatMap(l => l.cards).find(c => c.id === id && !c.ghost); if (!card) return;
    const scope = scopeFor(card, d.params), key = JSON.stringify(scope);
    const has = state.done.some(x => x.id === id && JSON.stringify(x.scope || {}) === key);
    state.done = has ? state.done.filter(x => !(x.id === id && JSON.stringify(x.scope || {}) === key)) : state.done.concat([{ id, scope }]);
    set({}, true);
  }
  const parseSel = n => { const [li, id, alt] = n.dataset.sel.split('|'); return { li: Number(li), id, alt: alt === '1' }; };
  document.addEventListener('click', e => {
    const cb = e.target.closest('[data-conn]');
    if (cb) {
      const panel = document.getElementById('conn-panel'), a = cb.dataset.conn;
      if (a === 'close') { readConnForm(); panel.hidden = true; document.getElementById('conn-btn').setAttribute('aria-expanded', 'false'); }
      else if (a === 'off') disconnect();
      else if (a === 'mode-proxy' || a === 'mode-direct') { if (a === 'mode-direct' && !LOCAL_DEV) return; readConnForm(); conn.mode = a === 'mode-proxy' ? 'proxy' : 'direct'; saveConn(); renderConn(); }
      else { readConnForm(); connect(); }
      return;
    }
    const w = e.target.closest('[data-word]'); if (w) { toggleWord(w.dataset.word); return; }
    const a = e.target.closest('[data-action]'); if (a) { act(a.dataset.action); return; }
    const y = e.target.closest('[data-answer]'); if (y) { answer(y.dataset.answer, y.dataset.value); return; }
    const dn = e.target.closest('[data-done]'); if (dn) { toggleDone(dn.dataset.done); return; }
    const n = e.target.closest('[data-sel]'); if (n) set({ sel: parseSel(n) });
  });
  document.addEventListener('change', e => { if (e.target && e.target.id === 'c-provider') { const P = PRESETS()[e.target.value]; conn.provider = e.target.value; conn.base = P.base; conn.model = P.model; saveConn(); renderConn(); } });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-answer-form]'); if (f) { e.preventDefault(); answer(f.dataset.answerForm, f.elements.answer.value); return; }
    const sf = e.target.closest('[data-story-form]'); if (sf) { e.preventDefault(); readStory(sf.elements.text.value); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const n = e.target.closest && e.target.closest('[data-sel]'); if (!n) return;
    e.preventDefault(); set({ sel: parseSel(n) });
  });
  document.getElementById('tree').addEventListener('mouseover', e => { const g = e.target.closest('[data-lane]'); const id = g ? g.dataset.lane : null; if (id !== state.hover) set({ hover: id }); });
  document.getElementById('tree').addEventListener('mouseleave', () => { if (state.hover) set({ hover: null }); });
  document.getElementById('mode-situation').addEventListener('click', () => act('mode-situation'));
  document.getElementById('mode-explore').addEventListener('click', () => act('mode-explore'));
  document.getElementById('clear-btn').addEventListener('click', () => act('clear'));
  document.getElementById('lang-fr').addEventListener('click', () => setLang('fr'));
  document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
  document.getElementById('conn-btn').addEventListener('click', () => { const p = document.getElementById('conn-panel'); p.hidden = !p.hidden; document.getElementById('conn-btn').setAttribute('aria-expanded', String(!p.hidden)); renderConn(); });

  load();
  renderConn();
  render();
  if (PUBLIC_PROXY_URL) connect();
})();
</script>
</body>
