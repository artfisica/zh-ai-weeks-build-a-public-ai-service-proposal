<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public AI pour chaque commune</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1EC; --panel:#FBFAF7; --white:#FFFFFF; --ink:#1B1A17; --muted:#5A5751; --faint:#5A5751;
    --line:#DDD8CC; --accent:#1F4E8C; --accent-soft:#E7EEF8; --accent-mist:#EEF2F8;
    --done:#2E6A4B; --confirm:#8A5300; --serif:'Fraunces',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
  body.explore{background:var(--accent-mist)}
  button{font:inherit;cursor:pointer}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  header{position:relative;min-height:56px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:8px 24px;border-bottom:1px solid var(--line);background:var(--white)}
  .right{flex-wrap:wrap}
  @media (max-width:700px){header{padding:8px 14px}.brand{font-size:17px}.conn-btn{max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:32px}.mode button{padding:0 10px}}
  .brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
  .right{display:flex;align-items:center;gap:14px}
  .link-btn{border:none;background:none;color:var(--muted);text-decoration:underline;text-decoration-color:#B9B3A5;padding:6px 2px;font-size:12px}
  .conn-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font-size:12px;color:var(--ink)}
  .conn-btn i{width:8px;height:8px;border-radius:50%;background:#B9B3A5;display:inline-block}
  .conn-btn.ok i{background:var(--done)}
  .conn-btn.error i{background:#B4412A}
  .conn-panel{position:absolute;top:60px;right:24px;width:420px;padding:16px;border-radius:12px;background:var(--white);border:1px solid var(--line);box-shadow:0 16px 40px rgba(27,26,23,.14);display:flex;flex-direction:column;gap:10px;z-index:5}
  .conn-panel[hidden]{display:none}
  .conn-panel label{font-size:12px;color:var(--muted)}
  .conn-panel input{width:100%;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font:inherit;color:var(--ink)}
  .conn-panel .caption,.caption{font-size:11px;color:var(--muted)}
  .conn-panel .err,.err{font-size:12px;color:#8A3A2A}
  .mode{display:flex;padding:3px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
  .mode button{height:34px;padding:0 14px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-weight:500}
  .mode button[aria-pressed="true"]{background:var(--white);color:var(--ink)}
  .mode button.explore[aria-pressed="true"]{background:var(--accent);color:var(--white)}
  .lang{display:flex;gap:2px;font-size:12px}
  .lang button{height:30px;padding:0 9px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-weight:600}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 56px);align-items:start}
  .story,.tree,.detail{min-width:0}
  .layout.is-new{grid-template-columns:1fr}
  .layout.is-new .story{display:none}
  .layout.is-new .tree{max-width:1000px;width:100%;margin:auto}
  .detail{display:none!important}
  .layout.has-detail .detail{display:flex!important;position:fixed;right:18px;top:76px;width:370px;max-height:calc(100vh - 94px);overflow:auto;z-index:4;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px #1b1a1729}
  .detail-close{align-self:flex-end;border:1px solid var(--line);border-radius:99px;background:white;padding:5px 12px;color:var(--muted)}
  @media(min-width:901px) and (max-width:1699px){.layout.has-detail .map-tools,.layout.has-detail .map-comparison{margin-right:400px}}
  @media(min-width:1700px){.layout.has-detail{grid-template-columns:300px minmax(0,1fr) 370px}.layout.has-detail .detail{position:sticky;top:16px;width:auto;max-height:calc(100vh - 32px);margin:16px;right:auto}}
  @media (max-width:900px){.layout{grid-template-columns:1fr}.story{border:none;border-bottom:1px solid var(--line)}.story.is-empty{display:none}.layout.has-detail .detail{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:75vh}.story{padding:20px!important}}
  .story{padding:28px 24px 20px 28px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:16px}
  .eyebrow{font-size:12px;color:var(--muted)}
  body.explore .eyebrow.story-label{color:var(--accent)}
  .sentence{overflow-wrap:anywhere;margin:0;font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.55;white-space:pre-wrap}
  .word{display:inline;padding:0 2px;margin:0;border:none;border-bottom:2px solid #B9B3A5;background:transparent;color:var(--ink);border-radius:3px 3px 0 0;font:inherit}
  .word.pending{border-bottom-style:dashed;border-bottom-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .word.changed{border-bottom-color:var(--accent);color:var(--accent)}
  .word.hyp{border-bottom-style:dashed;border-bottom-color:var(--accent);background:var(--accent-mist);color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:13px}
  .answered{margin:0;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--muted)}
  .answered b{font-weight:500;color:var(--ink)}
  .hint{font-size:12px;color:var(--muted)}
  .banner{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft)}
  .banner .eyebrow{color:var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;min-height:38px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-weight:500;line-height:1.2}
  .btn.primary{border-color:var(--accent);background:var(--accent);color:var(--white)}
  .btn.ink{border-color:var(--ink)}
  .btn.done{border-color:var(--done);color:var(--done)}
  .spacer{flex:1}
  .note{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;background:var(--white);border:1px dashed #C9D5E8}
  .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
  .who i{width:8px;height:8px;border-radius:50%;background:#B9B3A5;display:inline-block;flex-shrink:0}
  .who.live{color:var(--accent)} .who.live i{background:var(--done)}
  .chat{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;padding-right:4px}
  .turn{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45}
  .turn.you{background:var(--white);border:1px solid var(--line);align-self:flex-end;max-width:90%}
  .turn.guide{background:var(--accent-mist);border:1px dashed #C9D5E8;display:flex;flex-direction:column;gap:6px}
  .ask{display:flex;flex-direction:column;gap:6px}
  .ask textarea{width:100%;min-height:96px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font:inherit;color:var(--ink);resize:vertical}
  .ask .field{display:flex;gap:8px;min-width:0;flex-wrap:wrap}
  .ask .field input{min-width:0;width:0;flex-basis:140px}
  .ask textarea.story-edit{min-height:140px}
  .ask .field button{height:auto;min-height:40px}
  .ask input{flex:1;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font:inherit;color:var(--ink)}
  .ask input:disabled,.ask textarea:disabled{border-style:dashed;background:transparent;color:var(--faint)}
  .ask button{min-width:40px;height:40px;padding:0 14px;border-radius:8px;border:none;background:var(--accent);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:500}
  .ask button:disabled{background:#B9B3A5;cursor:default}
  .tree{padding:24px 28px 20px;display:flex;flex-direction:column;position:relative;min-width:0;overflow:hidden;min-height:calc(100vh - 56px)}
  #tree-host{min-width:0}
  .map-viewport{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch;padding:8px 0 12px}
  .map-tools{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .map-title{margin:0;font-family:var(--serif);font-size:24px;line-height:1.15}
  .map-meta{font-size:12px;color:var(--muted);margin-top:5px}
  .map-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .map-actions button,.lane-tabs button{border:1px solid var(--line);background:var(--white);padding:7px 11px;border-radius:8px;color:var(--ink)}
  .map-actions button[aria-pressed="true"],.lane-tabs button[aria-pressed="true"]{background:var(--accent);color:white;border-color:var(--accent)}
  .catalogue-update{margin-bottom:12px;padding:12px;border:1px dashed var(--accent);border-radius:12px}
  .map-comparison{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px dashed var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:12px}
  .map-comparison span{flex:1;min-width:160px}
  .map-comparison button{border:1px solid var(--accent);border-radius:8px;padding:7px 12px;background:white;color:var(--accent)}
  .map-comparison button:last-child{background:var(--accent);color:white}
  .map-questions{border-top:1px solid var(--line);padding-top:16px;margin:8px 0 16px}
  .question-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .question-link{display:flex;align-items:center;gap:8px;text-align:left;border:1px dashed #b9b3a5;background:var(--panel);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:13px;max-width:100%}
  .question-link{overflow-wrap:anywhere}
  .question-link i{font-style:normal;border:1px dashed #8a867c;width:22px;height:22px;flex-shrink:0;display:grid;place-items:center;border-radius:50%}
  .lane-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  @media(max-width:600px){.tree{padding:20px 14px}.map-title{font-size:22px}.map-actions{gap:4px}.map-actions button{font-size:12px;padding:6px 9px}.map-viewport{overflow:hidden}.legend{gap:10px;justify-content:flex-start}.conn-panel{right:12px;left:12px;width:auto}}
  .tree svg{width:100%;height:auto;display:block;overflow:hidden}
  .tree .preview{min-width:0}
  .tree text{font-family:var(--sans)}
  .tree .branch-name{font-family:var(--serif)}
  .tree [data-sel]{cursor:pointer}
  .tree [data-sel]:hover circle[stroke]{stroke-width:4}
  .loading button{font-family:var(--sans);font-size:13px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:white}
  .answered button{font:inherit;text-align:left;border:none;border-bottom:1px dashed var(--muted);color:inherit;background:none;padding:0}
  #print-plan{display:none}
  @media print{body{background:white}header,.layout,#announcer{display:none!important}#print-plan{display:block;font:11pt/1.45 system-ui;color:#111}#print-plan h1{font:26pt Georgia}#print-plan svg{width:100%!important;height:auto;max-height:120mm;break-inside:avoid;margin:10pt 0}#print-plan h2{font:18pt Georgia;margin:24pt 0 8pt}#print-plan h3{margin:14pt 0 4pt}#print-plan section{break-inside:avoid}#print-plan a{color:#111;word-break:break-word}#print-plan .print-meta{font-size:9pt;color:#444}#print-plan .print-step{border-top:1px solid #ddd;padding-top:8pt;margin-top:10pt}#print-plan .print-question{font-weight:600}#print-plan .print-alternative{break-before:page}}
  .empty{margin:auto;max-width:640px;display:flex;flex-direction:column;gap:16px;padding:24px}
  .empty h1{margin:0;font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.15}
  .preview{width:100%;max-width:560px;height:auto;display:block;margin:0 auto 4px}
  .empty p{margin:0;font-size:15px;color:var(--muted)}
  .empty .example{padding:12px 14px;border-radius:10px;border:1px dashed #B9B3A5;background:var(--white);text-align:left;font:inherit;font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--ink)}
  .loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:rgba(243,241,236,.82);font-family:var(--serif);font-size:20px;color:var(--ink);text-align:center;padding:24px;z-index:2}
  .legend{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;padding-top:6px;font-size:11px;color:var(--muted)}
  .legend[hidden]{display:none}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--white);border:2px solid #8A867C}
  .dot.done{background:var(--done);border-color:var(--done)} .dot.ghost{border-style:dashed} .dot.alt{border-style:dashed;border-color:var(--accent)} .dot.changed{background:var(--accent);border-color:var(--accent)}
  @media (prefers-reduced-motion:no-preference){.tree path,.tree circle{transition:stroke .25s,fill .25s,stroke-width .25s}.tree path.grow{animation:grow .7s ease-out}@keyframes grow{from{opacity:0}to{opacity:1}}.tree path.draw:not([stroke-dasharray]),.preview path:not([stroke-dasharray]){stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.4,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}}
  .detail{padding:24px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:14px}
  .detail h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.3}
  .detail .lead{font-size:13px;color:var(--muted);margin:0}
  .pill{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px dashed var(--accent);color:var(--accent);background:var(--white);white-space:nowrap}
  .pill.solid{background:var(--accent);color:var(--white);border-style:solid}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .zone{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:10px;background:var(--white);border:1px solid var(--line)}
  .zone.draft-zone{border-style:dashed}
  .zone.model{background:var(--accent-mist);border:1px dashed #C9D5E8}
  .zone.alt{border:2px dashed var(--accent)}
  .zone.soft{border-style:dashed}
  .zone-title{font-size:12px;color:var(--faint)}
  .zone.model .zone-title{color:var(--accent)}
  .source{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 8px;margin:0 -8px;border-radius:8px;color:var(--ink);text-decoration:none}
  .ref{padding:4px 0;border-top:1px dashed var(--line)} .ref:first-of-type{border-top:none}
  .claim{font-size:13px;line-height:1.45;padding:4px 0 2px}
  .checked{font-size:11px;color:var(--muted)}
  .source .link{font-size:13px;text-decoration:underline;text-decoration-color:#B9B3A5}
  .badge{flex-shrink:0;padding:3px 7px;border-radius:4px;color:var(--white);font-size:10px;font-weight:600;letter-spacing:.03em}
  .badge.draft{color:var(--ink);background:var(--paper);border:1px dashed #8A867C}
  .draft-title{font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .status{display:flex;flex-direction:column;gap:4px;font-size:12px}
  .rv{display:inline-flex;align-items:center;gap:6px;font-weight:500}
  .rv i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
  .cf{color:var(--confirm);font-weight:500} .cf b{color:var(--ink);font-weight:400}
  .deps{font-size:12px;color:var(--muted)}
  .before{font-size:12px;color:var(--faint);text-decoration:line-through}
  .small{font-size:12px}
  .detail input{height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font:inherit;color:var(--ink);width:100%}
  .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
  .foot span{display:inline-flex;align-items:flex-start;gap:6px}
  .foot i{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;margin-top:5px}
</style>
</head>
<body>
<div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1F4E8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="3"/><circle cx="21" cy="7" r="3"/><circle cx="14" cy="22" r="3"/><path d="M9 9l5 10M19 9l-5 10"/></svg>
    <span id="brand-text">Public AI pour chaque commune</span>
  </div>
  <div class="right">
    <button type="button" class="link-btn" id="clear-btn"></button>
    <button type="button" class="conn-btn" id="conn-btn" aria-expanded="false"><i></i><span id="conn-label"></span></button>
    <div class="mode" role="group" aria-label="Mode">
      <button type="button" id="mode-situation" aria-pressed="true"></button>
      <button type="button" id="mode-explore" class="explore" aria-pressed="false"></button>
    </div>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" id="lang-fr" aria-pressed="true">FR</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="conn-panel" id="conn-panel" hidden></div>
</header>
<div class="layout">
  <aside class="story" id="story"></aside>
  <main class="tree" id="tree-wrap">
    <div id="tree-host"></div>
    <div class="legend" id="legend" hidden></div>
  </main>
  <aside class="detail" id="detail" role="region" aria-label="Step details / Détail de l’étape"></aside>
</div>
<section id="print-plan" aria-label="Printable plan"></section>
<script>
(function () {
  'use strict';
  // BEGIN GENERATED JOURNEY CONTRACT
// Pure contracts shared by the static app and Node tests. No network or DOM.
const Journey = (() => {
  const copy=x=>JSON.parse(JSON.stringify(x));
  const own=(o,k)=>Object.prototype.hasOwnProperty.call(o || {},k);
  const fail=message=>{throw new Error(message);};
  const id=x=>typeof x==='string' && /^[a-z][a-z0-9_]{0,63}$/.test(x) && !own(Object.prototype,x);
  const roles={current_commune:['origin','Current commune','Commune actuelle'],destination_commune:['destination','Destination commune','Commune de destination'],workplace:['workplace','Workplace','Lieu de travail'],housing_location:['home_location','Home location','Localisation du logement'],current_country:['origin_country','Country coming from','Pays de provenance'],housing_status:['housing','Housing','Logement'],children:['children','Children','Enfants'],permit:['permit','Permit','Permis'],citizenship:['nationality','Citizenship','Nationalité'],household:['household','Household','Ménage'],transport:['transport','Transport','Transport']};
  const literal=(text,value)=>{const v=String(value || '').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return !!v && new RegExp('(?<![\\p{L}\\p{N}])'+v+'(?![\\p{L}\\p{N}])','iu').test(text);};
  function validateFacts(input,text,language='en') {
    if(!Array.isArray(input)||input.length>16)fail('Return at most sixteen typed facts');
    const seen=new Set();return input.map(f=>{
      if(!f||!roles[f.type]||seen.has(f.type)||typeof f.value!=='string'||!f.value.trim()||typeof f.span!=='string')fail('Invalid, duplicate or untyped personal fact');
      let start=f.evidence && f.evidence.start,end=f.evidence && f.evidence.end;
      if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end>text.length||text.slice(start,end)!==f.span){
        const at=f.span?text.indexOf(f.span):-1;if(at<0||text.indexOf(f.span,at+1)!==-1)fail('Personal fact has no unambiguous literal evidence');start=at;end=at+f.span.length;
      }
      if(!literal(f.span,f.value))fail('Personal fact has no literal evidence');
      if(f.confidence && !['explicit','confirm'].includes(f.confidence))fail('Unknown fact confidence');
      seen.add(f.type);return {id:roles[f.type][0],type:f.type,label:roles[f.type][language==='fr'?2:1],value:f.value.trim(),span:f.span,evidence:{start,end,quote:f.span},alternatives:[],confidence:f.confidence || 'explicit'};
    });
  }
  function extract(text,language='en') {
    const facts=[];

      if(translated)tree.questions=tree.questions.map((q,i)=>({...q,text:translated[i].text,options:translated[i].options,textOrigins:{...(q.textOrigins || {}),text:{kind:'model',provider:translated[i].provider},why:{kind:'application'}},why:t('Cette réponse personnelle précise les pistes concernées.','This personal answer refines the affected paths.')}));
      tree.key=hash(previous.key+'|'+LANG);delete tree.acceptedRevision;
      const defs=Object.assign({},exploring?state.exploreQuestionDefs:state.questionDefs,Object.fromEntries(tree.questions.map(q=>[q.id,q]))),vars=currentVars().map(f=>({...f,label:Journey.roles[f.type]?Journey.roles[f.type][LANG==='fr'?2:1]:f.label}));
      if(exploring)set({exploreTree:tree,exploreVars:vars,exploreQuestionDefs:defs,loading:'',sel:null});
      else{const done=state.done.slice();completed.forEach(id=>done.push(completionKey(tree,vars,state.answers,id)));set({tree,vars,done:[...new Set(done)],questionDefs:defs,prevTree:null,loading:'',sel:null,note:{text:tree.note,prov:tree.prov}},true);}
    }catch(e){if(stillCurrent(id)){LANG=old;try{localStorage.setItem(LANG_KEY,old);}catch(_){}renderConn();set({loading:'',error:t('La traduction n’a pas pu être vérifiée. Votre carte est conservée.','The translation could not be verified. Your map is preserved.')});}}
  }
  function leaveExplore() { cancelRequests(); set({ mode: 'situation', loading: '', error: '', sel: null, exploreVars: null, exploreTree: null, exploreStory: null, exploreAnswers: {}, exploreQtexts: {}, exploreTurns: [] }); }

  // ---- Events ----
  document.addEventListener('click', e => {
    const cb = e.target.closest('[data-conn]'); if (cb) { const p = document.getElementById('conn-panel'); if (cb.dataset.conn === 'close') { p.hidden = true; } else { const el = document.getElementById('c-proxy'); if (el) conn.proxyUrl = el.value.trim(); const token = document.getElementById('c-token'); if (token) conn.demoToken = token.value.trim(); connect(); } return; }
    const ex = e.target.closest('[data-example]'); if (ex) { startStory(ex.dataset.example); return; }
    const narrow = () => {};
    const aw = e.target.closest('[data-answered]'); if (aw) { set({ sel: { aq: aw.dataset.answered } }); return; }
    const pa = e.target.closest('[data-propose-answer]'); if (pa) { proposeAnswer(pa.dataset.proposeAnswer, pa.dataset.value); return; }
    const w = e.target.closest('[data-var]'); if (w) { set({ sel: { v: w.dataset.var } }); narrow(); return; }
    const pr = e.target.closest('[data-propose]'); if (pr) { propose(pr.dataset.propose, pr.dataset.value); return; }
    const a = e.target.closest('[data-action]'); if (a) { const x = a.dataset.action; if (x === 'recover-inputs') { recoverInputs();return; } if (x === 'confirm-answer') { confirmProposedAnswer(a.dataset.question); return; } if (x === 'confirm-goal') { const goal=state.goalConfirmation; if(goal)stageStory(goal.suggestion,true); return; } if (x === 'edit-goal') { const goal=state.goalConfirmation; set({goalConfirmation:null,followDraft:goal ? goal.request : ''}); return; } if (x === 'complete-map') { completeMap(); return; } if (x === 'toggle-remember') { toggleRemember(); return; } if (x === 'refresh-sources') { refreshSources(); return; } if (x === 'cancel-request') { cancelRequests(); set({ loading: '', error: '' }); return; } if (x === 'close-detail') { set({ sel: null }); return; } if (x === 'plan') { set({ sel: { plan: true } }); return; } if (x === 'undo') { undo(); return; } if (x === 'fit') { set({ mapZoom: 'fit' }); return; } if (x === 'zoom-in' || x === 'zoom-out') { set({ mapZoom: Math.max(.6, Math.min(1.8, (typeof state.mapZoom === 'number' ? state.mapZoom : 1) + (x === 'zoom-in' ? .2 : -.2))) }); return; } if (x === 'print-plan') { printPlan(derive()); return; } if (x === 'edit-story') { set({ editing: !state.editing, editDraft: viewedStory() }); return; } if (x === 'dismiss-suggestion') { set({ suggestedStory: '' }); return; } if (x === 'copy-plan') { const d = derive(); if (d.tree && navigator.clipboard) navigator.clipboard.writeText(planText(d)).then(() => { a.textContent = t('Copié', 'Copied'); setTimeout(render, 1500); }).catch(() => {}); return; } if (x === 'keep') keep(); else if (x === 'adopt') adopt(); else if (x === 'mode-situation') leaveExplore(); return; }
    const lane = e.target.closest('[data-lane-select]'); if (lane) { set({ activeLane: lane.dataset.laneSelect, sel: null }); return; }
    const y = e.target.closest('[data-answer]'); if (y) { answer(y.dataset.answer, y.dataset.value); return; }
    const dn = e.target.closest('[data-done]'); if (dn) { const id = dn.dataset.done, key = doneKey(id); state.done = isDone(id) ? state.done.filter(x => x !== key) : state.done.concat([key]); set({}, true); return; }
    const qa = e.target.closest('[data-q-alt]'); if (qa) { set({ sel: { qAlt: qa.dataset.qAlt } }); return; }
    const q = e.target.closest('[data-q]'); if (q) { set({ sel: { q: q.dataset.q } }); narrow(); return; }
    const n = e.target.closest('[data-sel]'); if (n) { const [li, id, alt] = n.dataset.sel.split('|'); set({ sel: { li: Number(li), id, alt: alt === '1' } }); narrow(); }
  });
  document.addEventListener('input', e => { const el = e.target; if (el.id === 'c-token') conn.demoToken = el.value; else if (el.id === 'ask') state.followDraft = el.value; else if (el.id === 'edit') state.editDraft = el.value; else if (el.closest('[data-start-form]')) state.draftStory = el.value; });
  document.addEventListener('submit', e => {
    const sf = e.target.closest('[data-start-form]'); if (sf) { e.preventDefault(); startStory(sf.elements.text.value); return; }
    const cf = e.target.closest('[data-converse-form]'); if (cf) { e.preventDefault(); const v = cf.elements.text.value; cf.elements.text.value = ''; converse(v); return; }
    const sg = e.target.closest('[data-suggest-form]'); if (sg) { e.preventDefault(); applySuggestedStory(sg.elements.text.value); return; }
    const st = e.target.closest('[data-story-form]'); if (st) { e.preventDefault(); state.editing = false; if (st.elements.text.value.trim() !== viewedStory()) stageStory(st.elements.text.value); else if ((derive().tree || {}).incomplete) completeMap(); else render(); return; }
    const pf = e.target.closest('[data-propose-form]'); if (pf) { e.preventDefault(); propose(pf.dataset.proposeForm, pf.elements.value.value); return; }
    const paf = e.target.closest('[data-propose-answer-form]'); if (paf) { e.preventDefault(); proposeAnswer(paf.dataset.proposeAnswerForm, paf.elements.value.value); return; }
    const af = e.target.closest('[data-answer-form]'); if (af) { e.preventDefault(); answer(af.dataset.answerForm, af.elements.answer.value); }
  });
  document.addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const n = e.target.closest && (e.target.closest('[data-sel]') || e.target.closest('[data-q]')); if (!n) return; e.preventDefault(); if (typeof n.click === 'function') n.click(); else n.dispatchEvent(new MouseEvent('click', { bubbles: true })); });
  document.getElementById('mode-situation').addEventListener('click', leaveExplore);
  document.getElementById('mode-explore').addEventListener('click', () => { if (!state.tree || state.loading || state.mode === 'explore') return; set({ mode: 'explore', pending: null, sel: null, exploreStory: state.story, exploreVars: state.vars.map(v => Object.assign({}, v)), exploreTree: state.tree, exploreAnswers: Object.assign({}, state.answers), exploreQtexts: Object.assign({}, state.qtexts), exploreQuestionDefs: Object.assign({}, state.questionDefs), exploreTurns: [] }); });
  document.getElementById('clear-btn').addEventListener('click', reset);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (state.loading) { cancelRequests(); set({ loading: '' }); } else set({ sel: null }); } });
  window.addEventListener('storage', e => { if (e.key === STORE_KEY + '.remember' || e.key === null || (e.key === STORE_KEY && e.newValue === null)) { try { rememberOnDevice = e.key === null || e.key === STORE_KEY ? false : localStorage.getItem(STORE_KEY + '.remember') !== 'no'; } catch (_) {} render(); } });
  let resizeTimer; window.addEventListener('resize', () => { clearTimeout(resizeTimer); if (!state.tree) return; resizeTimer = setTimeout(() => renderTree(derive()), 150); });
  document.getElementById('lang-fr').addEventListener('click', () => setLang('fr'));
  document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
  document.getElementById('conn-btn').addEventListener('click', () => { const p = document.getElementById('conn-panel'); p.hidden = !p.hidden; renderConn(); });

  const bounded = fn => async function(...args) {
    const parent=operation, op=parent || {calls:0,deadline:Date.now()+90000};if(!parent)operation=op;
    try{return await fn(...args);}finally{if(!parent && operation===op)operation=null;}
  };
  recoverInputs=bounded(recoverInputs);startStory=bounded(startStory);converse=bounded(converse);stageStory=bounded(stageStory);propose=bounded(propose);proposeAnswer=bounded(proposeAnswer);answer=bounded(answer);completeMap=bounded(completeMap);refreshSources=bounded(refreshSources);fetchTree=bounded(fetchTree);setLang=bounded(setLang);
  load(); renderConn(); render();
  if (PUBLIC_PROXY_URL) connect();
  else if (conn.proxyUrl) connect();
  else fetch('proxy-url.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => { if (j && j.url && !conn.proxyUrl) { conn.proxyUrl = j.url; connect(); } }).catch(() => {});
})();
</script>
