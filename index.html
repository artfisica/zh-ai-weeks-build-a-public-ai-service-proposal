<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public AI pour chaque commune</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1EC; --panel:#FBFAF7; --white:#FFFFFF; --ink:#1B1A17; --muted:#5A5751; --faint:#7A766E;
    --line:#DDD8CC; --accent:#1F4E8C; --accent-soft:#E7EEF8; --accent-mist:#EEF2F8;
    --done:#2E6A4B; --confirm:#8A5300; --serif:'Fraunces',Georgia,serif; --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
  body.explore{background:var(--accent-mist)}
  button{font:inherit;cursor:pointer}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  header{position:relative;min-height:56px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:8px 24px;border-bottom:1px solid var(--line);background:var(--white)}
  .right{flex-wrap:wrap}
  @media (max-width:700px){header{padding:8px 14px}.brand{font-size:17px}.conn-btn{max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:32px}.mode button{padding:0 10px}}
  .brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
  .right{display:flex;align-items:center;gap:14px}
  .link-btn{border:none;background:none;color:var(--muted);text-decoration:underline;text-decoration-color:#B9B3A5;padding:6px 2px;font-size:12px}
  .conn-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font-size:12px;color:var(--ink)}
  .conn-btn i{width:8px;height:8px;border-radius:50%;background:#B9B3A5;display:inline-block}
  .conn-btn.ok i{background:var(--done)}
  .conn-btn.error i{background:#B4412A}
  .conn-panel{position:absolute;top:60px;right:24px;width:420px;padding:16px;border-radius:12px;background:var(--white);border:1px solid var(--line);box-shadow:0 16px 40px rgba(27,26,23,.14);display:flex;flex-direction:column;gap:10px;z-index:5}
  .conn-panel[hidden]{display:none}
  .conn-panel label{font-size:12px;color:var(--muted)}
  .conn-panel input{width:100%;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font:inherit;color:var(--ink)}
  .conn-panel .caption,.caption{font-size:11px;color:var(--muted)}
  .conn-panel .err,.err{font-size:12px;color:#8A3A2A}
  .mode{display:flex;padding:3px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
  .mode button{height:34px;padding:0 14px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-weight:500}
  .mode button[aria-pressed="true"]{background:var(--white);color:var(--ink)}
  .mode button.explore[aria-pressed="true"]{background:var(--accent);color:var(--white)}
  .lang{display:flex;gap:2px;font-size:12px}
  .lang button{height:30px;padding:0 9px;border-radius:6px;border:none;background:transparent;color:var(--muted);font-weight:600}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr) 400px;min-height:calc(100vh - 56px)}
  @media (max-width:1100px){.layout{grid-template-columns:1fr}.story,.detail{border:none;border-bottom:1px solid var(--line)}.story.is-empty{display:none}.tree{overflow-x:auto;-webkit-overflow-scrolling:touch}.tree svg{min-width:900px}.detail{border-top:1px solid var(--line)}}
  .story{padding:28px 24px 20px 28px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:16px}
  .eyebrow{font-size:12px;color:var(--muted)}
  body.explore .eyebrow.story-label{color:var(--accent)}
  .sentence{margin:0;font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.55;white-space:pre-wrap}
  .word{display:inline;padding:0 2px;margin:0;border:none;border-bottom:2px solid #B9B3A5;background:transparent;color:var(--ink);border-radius:3px 3px 0 0;font:inherit}
  .word.pending{border-bottom-style:dashed;border-bottom-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .word.changed{border-bottom-color:var(--accent);color:var(--accent)}
  .word.hyp{border-bottom-style:dashed;border-bottom-color:var(--accent);background:var(--accent-mist);color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:13px}
  .answered{margin:0;font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--muted)}
  .answered b{font-weight:500;color:var(--ink)}
  .hint{font-size:12px;color:var(--muted)}
  .banner{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft)}
  .banner .eyebrow{color:var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;min-height:38px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--white);color:var(--ink);font-weight:500;line-height:1.2}
  .btn.primary{border-color:var(--accent);background:var(--accent);color:var(--white)}
  .btn.ink{border-color:var(--ink)}
  .btn.done{border-color:var(--done);color:var(--done)}
  .spacer{flex:1}
  .note{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;background:var(--white);border:1px dashed #C9D5E8}
  .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
  .who i{width:8px;height:8px;border-radius:50%;background:#B9B3A5;display:inline-block;flex-shrink:0}
  .who.live{color:var(--accent)} .who.live i{background:var(--done)}
  .ask{display:flex;flex-direction:column;gap:6px}
  .ask textarea{width:100%;min-height:96px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font:inherit;color:var(--ink);resize:vertical}
  .ask .field{display:flex;gap:8px}
  .ask input{flex:1;height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font:inherit;color:var(--ink)}
  .ask input:disabled,.ask textarea:disabled{border-style:dashed;background:transparent;color:var(--faint)}
  .ask button{min-width:40px;height:40px;padding:0 14px;border-radius:8px;border:none;background:var(--accent);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:500}
  .ask button:disabled{background:#B9B3A5;cursor:default}
  .tree{padding:16px 12px 10px;display:flex;flex-direction:column;position:relative}
  .tree svg{width:100%;height:auto;display:block;overflow:visible}
  .tree text{font-family:var(--sans)}
  .tree .branch-name{font-family:var(--serif)}
  .tree [data-sel]{cursor:pointer}
  .empty{margin:auto;max-width:640px;display:flex;flex-direction:column;gap:16px;padding:24px}
  .empty h1{margin:0;font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.15}
  .empty p{margin:0;font-size:15px;color:var(--muted)}
  .empty .example{padding:12px 14px;border-radius:10px;border:1px dashed #B9B3A5;background:var(--white);text-align:left;font:inherit;font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--ink)}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(243,241,236,.82);font-family:var(--serif);font-size:20px;color:var(--ink);text-align:center;padding:24px;z-index:2}
  .legend{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;padding-top:6px;font-size:11px;color:var(--muted)}
  .legend[hidden]{display:none}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--white);border:2px solid #8A867C}
  .dot.done{background:var(--done);border-color:var(--done)} .dot.ghost{border-style:dashed} .dot.alt{border-style:dashed;border-color:var(--accent)} .dot.changed{background:var(--accent);border-color:var(--accent)}
  @media (prefers-reduced-motion:no-preference){.tree path,.tree circle{transition:stroke .25s,fill .25s,stroke-width .25s}.tree path.grow{animation:grow .7s ease-out}@keyframes grow{from{opacity:0}to{opacity:1}}}
  .detail{padding:24px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:14px}
  .detail h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.3}
  .detail .lead{font-size:13px;color:var(--muted);margin:0}
  .pill{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px dashed var(--accent);color:var(--accent);background:var(--white);white-space:nowrap}
  .pill.solid{background:var(--accent);color:var(--white);border-style:solid}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .zone{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:10px;background:var(--white);border:1px solid var(--line)}
  .zone.model{background:var(--accent-mist);border:1px dashed #C9D5E8}
  .zone.alt{border:2px dashed var(--accent)}
  .zone.soft{border-style:dashed}
  .zone-title{font-size:12px;color:var(--faint)}
  .zone.model .zone-title{color:var(--accent)}
  .source{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 8px;margin:0 -8px;border-radius:8px;color:var(--ink);text-decoration:none}
  .source .link{font-size:13px;text-decoration:underline;text-decoration-color:#B9B3A5}
  .badge{flex-shrink:0;padding:3px 7px;border-radius:4px;color:var(--white);font-size:10px;font-weight:600;letter-spacing:.03em}
  .status{display:flex;flex-direction:column;gap:4px;font-size:12px}
  .rv{display:inline-flex;align-items:center;gap:6px;font-weight:500}
  .rv i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
  .cf{color:var(--confirm);font-weight:500} .cf b{color:var(--ink);font-weight:400}
  .deps{font-size:12px;color:var(--muted)}
  .before{font-size:12px;color:var(--faint);text-decoration:line-through}
  .small{font-size:12px}
  .detail input{height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--white);font:inherit;color:var(--ink);width:100%}
  .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
  .foot span{display:inline-flex;align-items:flex-start;gap:6px}
  .foot i{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;margin-top:5px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1F4E8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="3"/><circle cx="21" cy="7" r="3"/><circle cx="14" cy="22" r="3"/><path d="M9 9l5 10M19 9l-5 10"/></svg>
    <span id="brand-text">Public AI pour chaque commune</span>
  </div>
  <div class="right">
    <button type="button" class="link-btn" id="clear-btn"></button>
    <button type="button" class="conn-btn" id="conn-btn" aria-expanded="false"><i></i><span id="conn-label"></span></button>
    <div class="mode" role="group" aria-label="Mode">
      <button type="button" id="mode-situation" aria-pressed="true"></button>
      <button type="button" id="mode-explore" class="explore" aria-pressed="false"></button>
    </div>
    <div class="lang" role="group" aria-label="Langue / Language">
      <button type="button" id="lang-fr" aria-pressed="true">FR</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="conn-panel" id="conn-panel" hidden></div>
</header>
<div class="layout">
  <aside class="story" id="story"></aside>
  <main class="tree" id="tree-wrap">
    <div id="tree-host"></div>
    <div class="legend" id="legend" hidden></div>
  </main>
  <aside class="detail" id="detail"></aside>
</div>
<script>
(function () {
  'use strict';
  const PUBLIC_PROXY_URL = '';
  const LOCAL_DEV = location.protocol === 'file:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  const ACCENT = '#1F4E8C', STORE_KEY = 'public-ai-commune.v5', CONN_KEY = 'public-ai-commune.conn.v5', LANG_KEY = 'public-ai-commune.lang';
  let LANG = 'fr';
  try { LANG = localStorage.getItem(LANG_KEY) || ((navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'fr'); } catch (e) {}
  const t = (fr, en) => LANG === 'en' ? en : fr;
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
  const LV = () => ({ confederation: { name: t('Confédération', 'Confederation'), bg: '#2C3140' }, canton: { name: t('Canton', 'Canton'), bg: '#2E6A4B' }, commune: { name: t('Commune', 'Commune'), bg: '#9A452A' }, other: { name: t('Autre', 'Other'), bg: '#7A766E' } });

  // ---- The only place a link can come from. Apertus picks by id; anything else is shown as "no linked page yet". ----
  const CATALOG = [
    { id: 'ch-move', level: 'confederation', url: 'https://ch.ch/fr/annonce-depart-arrivee-commune-de-domicile', title: 'ch.ch — Annoncer son départ et son arrivée', covers: 'moving between communes in Switzerland: deregister, register, deadlines (general)' },
    { id: 'ch-move-checklist', level: 'confederation', url: 'https://www.ch.ch/fr/checkliste-demenagement', title: 'ch.ch — Aide-mémoire déménagement', covers: 'moving checklist: lease notice, new lease, address changes, insurance, utilities' },
    { id: 'vd-address', level: 'canton', url: 'https://www.vd.ch/prestation/annoncer-son-changement-dadresse-au-controle-des-habitants', title: 'État de Vaud — Annoncer son changement d’adresse (eDéménagement)', covers: 'Vaud: online change of address, conditions by permit type, list of connected communes' },
    { id: 'sem-b-eu', level: 'confederation', url: 'https://www.sem.admin.ch/sem/fr/home/themen/aufenthalt/eu_efta/ausweis_b_eu_efta.html', title: 'SEM — Permis B UE/AELE', covers: 'B permit for EU/EFTA nationals: validity 5 years, conditions' },
    { id: 'sem-third', level: 'confederation', url: 'https://www.sem.admin.ch/sem/fr/home/themen/aufenthalt/nicht_eu_efta.html', title: 'SEM — Permis de séjour, ressortissants d’États tiers', covers: 'permits for non-EU nationals: B (1 year renewable), C, L; family reunification' },
    { id: 'nyon-cdh', level: 'commune', url: 'https://www.nyon.ch/nyon-officiel/administration/controle-des-habitants-1382', title: 'Ville de Nyon — Contrôle des habitants', covers: 'Nyon residents registry: arrival, departure, address change' },
    { id: 'stcergue-arrival', level: 'commune', url: 'https://www.st-cergue.ch/prestations-communales/113320', title: 'Commune de Saint-Cergue — Arrivée à St-Cergue', covers: 'Saint-Cergue: registering on arrival, documents, deadline' },
    { id: 'vd-tax-communes', level: 'canton', url: 'https://www.vd.ch/etat-droit-finances/statistique/statistiques-par-domaine/18-finances-publiques-et-administration/finances-communales', title: 'Statistique Vaud — Arrêtés d’imposition des communes', covers: 'communal tax coefficients of all Vaud communes, by year' },
    { id: 'vd-vote-directive', level: 'canton', url: 'https://www.vd.ch/fileadmin/user_upload/themes/etat_droit/votations_elections/fichiers_pdf/Directive_droit_de_vote_en_mati%C3%A8re_communale.pdf', title: 'État de Vaud — Directive droit de vote communal', covers: 'who may vote at communal level in Vaud, including foreign residents (conditions)' },
    { id: 'otd', level: 'confederation', url: 'https://opentransportdata.swiss', title: 'Plateforme open data mobilité suisse', covers: 'public transport timetables and stops as open data (not loaded by this page)' },
    { id: 'mobilis', level: 'canton', url: 'https://www.mobilis-vaud.ch', title: 'Mobilis — Communauté tarifaire vaudoise', covers: 'Vaud public transport fare zones and passes (site root)' },
    { id: 'vd-root', level: 'canton', url: 'https://www.vd.ch', title: 'État de Vaud (site officiel)', covers: 'any Vaud cantonal service not listed above: schools (DGEO), taxes (ACI), health, family; site root, exact page to be linked' },
    { id: 'ch-root', level: 'confederation', url: 'https://www.ch.ch', title: 'ch.ch — Les autorités suisses en ligne', covers: 'any federal topic not listed above: work, family, health insurance, taxes; site root' }
  ];
  const catalogById = id => CATALOG.find(c => c.id === id) || null;
  const catalogForPrompt = () => CATALOG.map(c => c.id + ' [' + c.level + '] ' + c.covers).join('\n');

  // ---- State ----
  const state = { mode: 'situation', story: '', vars: [], exploreVars: null, answers: {}, qtexts: {}, tree: null, trees: {}, pending: null, prevTree: null, sel: null, hover: null, loading: '', error: '', note: null, done: [], touched: false };
  function load() { try { const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (d && d.story) { state.story = d.story; state.vars = d.vars || []; state.answers = d.answers || {}; state.qtexts = d.qtexts || {}; state.trees = d.trees || {}; state.tree = d.tree || null; state.done = d.done || []; } } catch (e) {} }
  function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ story: state.story, vars: state.vars, answers: state.answers, qtexts: state.qtexts, trees: state.trees, tree: state.tree, done: state.done })); } catch (e) {} }
  const set = (patch, save) => { Object.assign(state, patch); if (save) persist(); render(); };

  // ---- Connection (proxy only on the public site) ----
  const conn = Object.assign({ proxyUrl: '', status: 'off', error: '', prov: null }, (() => { try { return JSON.parse(sessionStorage.getItem(CONN_KEY) || '{}'); } catch (e) { return {}; } })());
  conn.status = 'off'; conn.prov = null; if (PUBLIC_PROXY_URL) conn.proxyUrl = PUBLIC_PROXY_URL;
  const saveConn = () => { try { sessionStorage.setItem(CONN_KEY, JSON.stringify({ proxyUrl: conn.proxyUrl })); } catch (e) {} };
  const live = () => conn.status === 'ok';
  const provLabel = p => p ? 'Apertus via ' + p.provider + (p.model ? ' (' + String(p.model).split('/').pop() + ')' : '') : t('Texte préparé', 'Prepared text');
  async function chat(messages, maxTokens) {
    const r = await fetch(conn.proxyUrl.replace(/\/$/, '') + '/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages, max_tokens: maxTokens || 3000, temperature: 0.2 }) });
    if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 429 ? t(' (limite atteinte)', ' (limit reached)') : ''));
    const j = await r.json();
    return { text: (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '', prov: j.provenance || { provider: 'proxy', model: '' } };
  }
  async function connect() {
    conn.status = 'testing'; conn.error = ''; conn.prov = null; saveConn(); renderConn();
    try {
      if (!conn.proxyUrl) throw new Error(t('adresse du proxy manquante', 'proxy address missing'));
      const r = await fetch(conn.proxyUrl.replace(/\/$/, '') + '/health'); let h = null; try { h = await r.json(); } catch (e) {}
      if (!h) throw new Error('HTTP ' + r.status);
      if (!h.ready) throw new Error(t('le proxy n’est pas prêt', 'the proxy is not ready') + (h.missing ? ' : ' + h.missing.join(', ') : ''));
      if (h.maxTokens === undefined) throw new Error(t('le proxy tourne avec un ancien serveur. Dans le Codespace : git pull ; pkill node ; bash proxy/start.sh', 'the proxy is running an old server. In the Codespace: git pull; pkill node; bash proxy/start.sh'));
      if (h.maxTokens && h.maxTokens < 2500) throw new Error(t('le proxy limite les réponses à ', 'the proxy caps answers at ') + h.maxTokens + t(' tokens ; une carte en demande 3000. Dans le Codespace : git pull, puis bash proxy/start.sh', ' tokens; a map needs 3000. In the Codespace: git pull, then bash proxy/start.sh'));
      conn.prov = { provider: h.provider || 'proxy', model: h.model || '' }; conn.status = 'ok';
    } catch (e) { conn.status = 'error'; conn.error = (e && e.message) || 'failed'; }
    renderConn(); render();
  }

  // ---- Asking Apertus for the map ----
  const SCHEMA = '{"variables":[{"id":"snake_case","label":"short label","value":"as in the sentence","span":"exact words from the sentence or empty","alternatives":["one or two plausible other values"]}],"questions":[{"id":"q_snake","text":"question","why":"one sentence","type":"yesno|choice|text","options":["only for choice"]}],"branches":[{"id":"snake","name":"short name","steps":[{"id":"snake_stable","short":"3 to 5 words","title":"one action sentence","why":"why this step exists, one or two sentences","depends_on":["variable or question ids"],"source":"catalog id or null","authority":"confederation|canton|commune","confirm_with":"office name or null"}]}],"note":"one sentence to the person"}';
  function systemPrompt() {
    return (LANG === 'en'
      ? 'You are the guide of a Swiss public service that helps a person understand what a change in their life means for their dealings with commune, canton and Confederation. Write in English.'
      : 'Tu es le guide d’un service public suisse qui aide une personne à comprendre ce qu’un changement dans sa vie implique dans ses démarches avec la commune, le canton et la Confédération. Écris en français.') +
      '\nReturn ONLY a JSON object of this exact shape:\n' + SCHEMA +

        if (k !== 'added') {
          const st = c.a, changed = k.indexOf('applied-') === 0, done = isDone(st.id), removed = k === 'removed';
          const selected = s.sel && s.sel.li === li && s.sel.id === c.id && !s.sel.alt;
          out += '<g data-sel="' + li + '|' + esc(c.id) + '|0" tabindex="0" role="button" aria-label="' + esc(st.title) + '"' + (removed ? ' opacity="0.55"' : '') + '>';
          if (selected) out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="19" fill="none" stroke="#1B1A17" stroke-width="1.5" stroke-dasharray="3 3"/>';
          if (k === 'changed' || removed) out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="16" fill="' + ACCENT + '" opacity="0.14"/>';
          out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="10" fill="' + (changed ? ACCENT : done ? '#2E6A4B' : '#FFFFFF') + '" stroke="' + (changed ? '#FFFFFF' : done ? '#2E6A4B' : '#8A867C') + '" stroke-width="' + (changed ? 3 : 2) + '"/>';
          if (done && !changed) out += '<path d="M ' + (p.x - 4.5) + ' ' + p.y + ' l 3 3 l 6 -6.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
          out += '<text x="' + p.x + '" y="' + (p.y - 17) + '" text-anchor="middle" font-size="12" font-weight="' + (hl ? 600 : 500) + '" fill="' + (d.exploreOn ? '#3A4A63' : '#1B1A17') + '"' + (removed ? ' text-decoration="line-through"' : '') + '>' + esc(st.short) + '</text>';
          const sub = k === 'changed' ? t('changerait', 'would change') : removed ? t('disparaîtrait', 'would disappear') : k === 'applied-changed' ? t('modifiée', 'modified') : k === 'applied-added' ? t('ajoutée', 'added') : done ? t('faite', 'done') : '';
          if (sub) out += '<text x="' + p.x + '" y="' + (p.y + 26) + '" text-anchor="middle" font-size="10" fill="' + (done && k === 'same' ? '#2E6A4B' : ACCENT) + '">' + esc(sub) + '</text>';
          out += '</g>';
        }
        if (k === 'changed' || k === 'added') {
          const ay = p.y + 48, alt = c.b, selA = s.sel && s.sel.li === li && s.sel.id === c.id && s.sel.alt;
          out += '<g data-sel="' + li + '|' + esc(c.id) + '|1" tabindex="0" role="button" aria-label="' + esc(alt.title) + '">' + (selA ? '<circle cx="' + p.x + '" cy="' + ay + '" r="19" fill="none" stroke="' + ACCENT + '" stroke-width="1.5" stroke-dasharray="3 3"/>' : '') + '<circle cx="' + p.x + '" cy="' + ay + '" r="10" fill="#FFFFFF" stroke="' + ACCENT + '" stroke-width="2.5" stroke-dasharray="4 3"/><text x="' + p.x + '" y="' + (ay + 26) + '" text-anchor="middle" font-size="12" font-weight="600" fill="' + ACCENT + '">' + esc(alt.short) + (k === 'added' ? t(' (nouvelle)', ' (new)') : '') + '</text></g>';
        }
      });
      out += '</g>';
    });
    // open questions hang under the tree as dashed points
    const qs = qsOpen;
    if (qs.length) {
      const qy = QY; out += '<text x="' + X0 + '" y="' + (qy - 26) + '" font-size="12" fill="#5A5751">' + t('Questions qui changeraient la carte :', 'Questions that would change the map:') + '</text>';
      qs.forEach((q, i) => { const x = X0 + i * 190; out += '<g data-q="' + esc(q.id) + '" tabindex="0" role="button" style="cursor:pointer"><circle cx="' + x + '" cy="' + qy + '" r="10" fill="#FFFFFF" stroke="#8A867C" stroke-width="2" stroke-dasharray="3 3"/><text x="' + x + '" y="' + (qy + 4) + '" text-anchor="middle" font-size="12" font-weight="600" fill="#8A867C">?</text><text x="' + (x + 16) + '" y="' + (qy + 4) + '" font-size="12" fill="#1B1A17">' + esc(q.text.length > 26 ? q.text.slice(0, 25) + '…' : q.text) + '</text></g>'; });
    }
    out += '<circle cx="36" cy="' + ROOT.y + '" r="17" fill="#1B1A17"/><circle cx="36" cy="' + ROOT.y + '" r="6" fill="#FFFFFF"/><text x="36" y="' + (ROOT.y + 38) + '" text-anchor="middle" font-size="10" fill="#5A5751">' + t('Vous', 'You') + '</text>';
    host.innerHTML = overlay + '<svg viewBox="0 0 900 ' + H + '" aria-label="' + t('Carte des pistes', 'Map of paths') + '">' + out + '</svg>';
    const lg = document.getElementById('legend'); lg.hidden = !(d.previewOn || s.prevTree || d.exploreOn);
    lg.innerHTML = '<span><i class="dot done"></i>' + t('Faite (marquée par vous)', 'Done (marked by you)') + '</span><span><i class="dot"></i>' + t('Étape', 'Step') + '</span><span><i class="dot ghost"></i>' + t('Question en attente', 'Open question') + '</span><span><i class="dot alt"></i>' + t('Branche proposée', 'Proposed branch') + '</span><span><i class="dot changed"></i>' + t('Modifiée ou ajoutée', 'Modified or added') + '</span>';
  }

  // ---- Detail ----
  function sourceBlock(st) {
    const cat = catalogById(st.source), lv = LV()[st.authority] || LV().other;
    if (!cat) return '<div class="zone soft"><div class="zone-title">' + t('Aucune page officielle reliée pour cette étape', 'No official page linked for this step') + '</div><div class="small">' + t('Le guide ne relie que des pages de son catalogue ; aucune ne couvre cette étape. À vérifier auprès de : ', 'The guide only links pages from its catalogue; none covers this step. Check with: ') + '<b>' + esc(st.confirm_with || lv.name) + '</b></div></div>';
    const exact = cat.url.split('/').filter(Boolean).length > 2;
    return '<div class="zone' + (exact ? '' : ' soft') + '"><div class="zone-title">' + (exact ? t('Ce que la source établit', 'What the source establishes') : t('Où vérifier — site officiel, page précise à relier', 'Where to check — official site, exact page still to be linked')) + '</div><a class="source" href="' + esc(cat.url) + '" target="_blank" rel="noopener"><span class="badge" style="background:' + (LV()[cat.level] || lv).bg + '">' + esc((LV()[cat.level] || lv).name) + '</span><span class="link">' + esc(cat.title) + '</span></a><div class="status"><span class="rv" style="color:' + (cat.level === 'commune' ? '#7A766E' : ACCENT) + '"><i></i>' + (cat.level === 'commune' ? t('Page officielle reliée ; relecture communale en attente', 'Official page linked; commune review pending') : t('Source officielle (fédérale ou cantonale)', 'Official source (federal or cantonal)')) + '</span>' + (st.confirm_with ? '<span class="cf">' + t('À confirmer : ', 'To confirm with: ') + '<b>' + esc(st.confirm_with) + '</b></span>' : '') + '</div></div>';
  }
  function renderDetail(d) {
    const s = state, foot = '<div class="foot"><span><i style="background:#1F4E8C"></i>' + t('Les liens viennent d’un catalogue de pages officielles (ch.ch, sem.admin.ch, vd.ch, nyon.ch, st-cergue.ch). Apertus choisit dans ce catalogue, il n’invente aucun lien.', 'Links come from a catalogue of official pages (ch.ch, sem.admin.ch, vd.ch, nyon.ch, st-cergue.ch). Apertus chooses from it; it invents no link.') + '</span><span><i style="background:#7A766E"></i>' + t('Aucune commune n’a encore relu le contenu.', 'No commune has reviewed the content yet.') + '</span><span><i style="background:#2E6A4B"></i>' + t('Les étapes et leurs explications sont écrites par Apertus ; vérifiez sur la page reliée avant d’agir.', 'Steps and explanations are written by Apertus; verify on the linked page before acting.') + '</span></div>';
    let html = '';
    if (!d.tree) { html = '<div class="eyebrow">' + t('Comment ça marche', 'How it works') + '</div><h2>' + t('Vous racontez. Apertus dessine. Vous changez un mot.', 'You tell. Apertus draws. You change a word.') + '</h2><p class="lead">' + t('La carte montre des pistes parallèles. Chaque point est une étape avec sa page officielle. Touchez un mot souligné de votre phrase pour voir, en pointillé, ce qui changerait avant de décider.', 'The map shows parallel paths. Each point is a step with its official page. Touch an underlined word in your sentence to see, dashed, what would change before you decide.') + '</p>'; document.getElementById('detail').innerHTML = html + foot; return; }
    if (s.sel && s.sel.q) {
      const q = d.tree.questions.find(x => x.id === s.sel.q);
      if (q) { html = '<div class="eyebrow">' + t('Question en attente', 'Open question') + '</div><h2>' + esc(q.text) + '</h2><div class="zone model"><div class="zone-title">' + t('Pourquoi cette question', 'Why this question') + '</div><div class="who live"><i></i>' + esc(provLabel(d.tree.prov)) + '</div><div>' + esc(q.why) + '</div></div>';
        if (q.type === 'yesno') html += '<div class="row"><button type="button" class="btn" data-answer="' + esc(q.id) + '" data-value="' + t('oui', 'yes') + '">' + t('Oui', 'Yes') + '</button><button type="button" class="btn" data-answer="' + esc(q.id) + '" data-value="' + t('non', 'no') + '">' + t('Non', 'No') + '</button></div>';
        else if (q.type === 'choice') html += '<div class="row">' + q.options.map(o => '<button type="button" class="btn" data-answer="' + esc(q.id) + '" data-value="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
        else html += '<form data-answer-form="' + esc(q.id) + '" style="display:flex;flex-direction:column;gap:8px"><input name="answer" type="text" autocomplete="off" placeholder="' + t('Votre réponse', 'Your answer') + '"><button type="submit" class="btn primary">' + t('Répondre : la carte se met à jour', 'Answer: the map updates') + '</button></form>';
        document.getElementById('detail').innerHTML = html + foot; return; }
    }
    if (s.sel && s.sel.v) {
      const v = currentVars().find(x => x.id === s.sel.v);
      if (v) { html = '<div class="eyebrow">' + esc(v.label) + '</div><h2>' + t('Et si ce n’était pas « ', 'What if it were not “') + esc(v.value) + t(' » ?', '”?') + '</h2><p class="lead">' + t('Choisissez une autre valeur : la branche correspondante pousse en pointillé, rien n’est appliqué tant que vous ne décidez pas.', 'Pick another value: the matching branch grows dashed; nothing is applied until you decide.') + '</p><div class="row">' + v.alternatives.map(a => '<button type="button" class="btn primary" data-propose="' + esc(v.id) + '" data-value="' + esc(a) + '">' + esc(a) + '</button>').join('') + '</div><form data-propose-form="' + esc(v.id) + '" style="display:flex;flex-direction:column;gap:8px"><input name="value" type="text" placeholder="' + t('Ou une autre valeur…', 'Or another value…') + '"><button type="submit" class="btn">' + t('Proposer', 'Propose') + '</button></form>';
        document.getElementById('detail').innerHTML = html + foot; return; }
    }
    const row = s.sel && d.rows[s.sel.li], cmp = row && row.cmp.find(c => c.id === s.sel.id);
    if (!cmp) {
      html = '<div class="eyebrow">' + t('Commencer ici', 'Start here') + '</div><h2>' + t('Touchez un mot souligné, ou un point.', 'Touch an underlined word, or a point.') + '</h2><p class="lead">' + t('Un mot souligné : Apertus propose une autre valeur et dessine, en pointillé, ce qui changerait. Un point : l’étape, sa page officielle, et qui peut la confirmer. Un « ? » sous l’arbre : une question dont la réponse ferait pousser une branche.', 'An underlined word: Apertus proposes another value and draws, dashed, what would change. A point: the step, its official page, and who can confirm it. A “?” under the tree: a question whose answer would grow a branch.') + '</p>';
      document.getElementById('detail').innerHTML = html + foot; return;
    }
    const k = cmp.kind, viewingAlt = !!(s.sel.alt && cmp.b), st = viewingAlt ? cmp.b : cmp.a, other = viewingAlt ? cmp.a : (d.previewOn ? cmp.b : null);
    const prov = viewingAlt && s.pending ? s.pending.tree.prov : d.tree.prov;
    const pill = viewingAlt ? '<span class="pill">' + (k === 'added' ? t('Apparaîtrait', 'Would appear') : t('Proposée', 'Proposed')) + '</span>' : k === 'applied-changed' ? '<span class="pill solid">' + t('Modifiée', 'Modified') + '</span>' : k === 'applied-added' ? '<span class="pill solid">' + t('Ajoutée', 'Added') + '</span>' : k === 'changed' ? '<span class="pill">' + t('Changerait', 'Would change') + '</span>' : k === 'removed' ? '<span class="pill">' + t('Disparaîtrait', 'Would disappear') + '</span>' : '';
    html = '<div class="head"><div class="eyebrow">' + esc(row.name) + '</div>' + pill + '</div><h2>' + esc(st.title) + '</h2>' + sourceBlock(st);
    html += '<div class="zone model"><div class="zone-title">' + t('Ce qu’Apertus explique', 'What Apertus explains') + '</div><div class="who live"><i></i>' + esc(provLabel(prov)) + '</div><div>' + esc(st.why) + '</div>' + (st.depends_on.length ? '<div class="deps">' + t('Dépend de : ', 'Depends on: ') + esc(st.depends_on.join(', ')) + '</div>' : '') + '</div>';
    if (!viewingAlt && !d.previewOn && k !== 'removed') { const dn = isDone(st.id); html += '<div class="row"><button type="button" class="btn ' + (dn ? 'done' : '') + '" data-done="' + esc(st.id) + '">' + (dn ? t('Faite — la remettre à faire', 'Done — mark as not done') : t('Je l’ai faite', 'I have done this')) + '</button></div>'; }
    if (other) {
      html += '<div class="zone alt"><div class="zone-title" style="color:var(--accent)">' + (viewingAlt ? t('Version enregistrée', 'Saved version') : t('Version proposée', 'Proposed version')) + '</div><div style="font-weight:600;font-size:15px">' + esc(other.title) + '</div><div class="small">' + esc(other.why) + '</div>' + sourceBlock(other) + '</div>';
    } else if (viewingAlt) html += '<div class="zone alt"><div class="zone-title" style="color:var(--accent)">' + t('Aujourd’hui : cette étape n’existe pas', 'Today: this step does not exist') + '</div></div>';
    if (d.previewOn) html += '<div class="row"><button type="button" class="btn ink" data-action="keep">' + t('Garder ', 'Keep ') + esc(s.pending.from) + '</button><button type="button" class="btn primary" data-action="adopt">' + t('Adopter ', 'Adopt ') + esc(s.pending.to) + t(' partout', ' everywhere') + '</button></div>';
    document.getElementById('detail').innerHTML = html + foot;
  }

  function renderConn() {
    const btn = document.getElementById('conn-btn'), label = document.getElementById('conn-label'), panel = document.getElementById('conn-panel');
    btn.className = 'conn-btn ' + (conn.status === 'ok' ? 'ok' : conn.status === 'error' ? 'error' : '');
    label.textContent = conn.status === 'ok' ? 'Apertus via ' + conn.prov.provider + (conn.prov.model ? ' (' + String(conn.prov.model).split('/').pop() + ')' : '') : conn.status === 'testing' ? t('Connexion…', 'Connecting…') : conn.status === 'error' ? t('Apertus indisponible pour l’instant', 'Apertus unavailable for now') : t('Apertus non connecté', 'Apertus not connected');
    if (panel.hidden) return;
    panel.innerHTML = '<div style="font-weight:600">' + t('Connecter Apertus', 'Connect Apertus') + '</div><label for="c-proxy">' + t('Adresse du proxy', 'Proxy address') + '</label><input id="c-proxy" value="' + esc(conn.proxyUrl) + '" placeholder="https://…-8787.app.github.dev"><div class="caption">' + t('Le proxy garde la clé côté serveur et tient un budget quotidien.', 'The proxy keeps the key server-side and holds a daily budget.') + '</div>' + (conn.error ? '<div class="err">' + esc(conn.error) + '</div>' : '') + '<div class="row"><button type="button" class="btn" data-conn="close">' + t('Fermer', 'Close') + '</button><button type="button" class="btn primary" data-conn="go">' + t('Connecter', 'Connect') + '</button></div>';
  }
  function renderChrome() {
    document.documentElement.lang = LANG; document.title = t('Public AI pour chaque commune', 'Public AI for every commune');
    document.getElementById('brand-text').textContent = t('Public AI pour chaque commune', 'Public AI for every commune');
    document.getElementById('clear-btn').textContent = state.story ? t('Recommencer', 'Start over') : '';
    document.getElementById('mode-situation').textContent = t('Ma situation', 'My situation'); document.getElementById('mode-explore').textContent = t('Explorer', 'Explore');
    document.getElementById('lang-fr').setAttribute('aria-pressed', String(LANG === 'fr')); document.getElementById('lang-en').setAttribute('aria-pressed', String(LANG === 'en'));
  }
  function render() { const d = derive(); renderChrome(); document.body.classList.toggle('explore', d.exploreOn); document.getElementById('mode-situation').setAttribute('aria-pressed', String(!d.exploreOn)); document.getElementById('mode-explore').setAttribute('aria-pressed', String(d.exploreOn)); renderStory(d); renderTree(d); renderDetail(d); }
  async function setLang(l) { LANG = l; try { localStorage.setItem(LANG_KEY, l); } catch (e) {} renderConn(); render(); if (state.story && live()) { set({ loading: t('Apertus traduit la carte…', 'Apertus is translating the map…') }); try { const tree = await fetchTree(state.story, state.vars, state.answers, null, null); set({ tree, prevTree: null, pending: null, sel: null, loading: '', note: { text: tree.note, prov: tree.prov } }, true); } catch (e) { set({ loading: '' }); } } }

  // ---- Events ----
  document.addEventListener('click', e => {
    const cb = e.target.closest('[data-conn]'); if (cb) { const p = document.getElementById('conn-panel'); if (cb.dataset.conn === 'close') { p.hidden = true; } else { const el = document.getElementById('c-proxy'); if (el) conn.proxyUrl = el.value.trim(); connect(); } return; }
    const ex = e.target.closest('[data-example]'); if (ex) { startStory(ex.dataset.example); return; }
    const narrow = () => window.innerWidth < 1100 && document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    const w = e.target.closest('[data-var]'); if (w) { set({ sel: { v: w.dataset.var } }); narrow(); return; }
    const pr = e.target.closest('[data-propose]'); if (pr) { propose(pr.dataset.propose, pr.dataset.value); return; }
    const a = e.target.closest('[data-action]'); if (a) { const x = a.dataset.action; if (x === 'keep') keep(); else if (x === 'adopt') adopt(); else if (x === 'mode-situation') set({ mode: 'situation', sel: null, exploreVars: null, exploreTree: null }); return; }
    const y = e.target.closest('[data-answer]'); if (y) { answer(y.dataset.answer, y.dataset.value); return; }
    const dn = e.target.closest('[data-done]'); if (dn) { const id = dn.dataset.done; state.done = isDone(id) ? state.done.filter(x => x !== id) : state.done.concat([id]); set({}, true); return; }
    const q = e.target.closest('[data-q]'); if (q) { set({ sel: { q: q.dataset.q } }); narrow(); return; }
    const n = e.target.closest('[data-sel]'); if (n) { const [li, id, alt] = n.dataset.sel.split('|'); set({ sel: { li: Number(li), id, alt: alt === '1' } }); narrow(); }
  });
  document.addEventListener('submit', e => {
    const sf = e.target.closest('[data-start-form]'); if (sf) { e.preventDefault(); startStory(sf.elements.text.value); return; }
    const st = e.target.closest('[data-story-form]'); if (st) { e.preventDefault(); if (st.elements.text.value.trim() !== state.story) startStory(st.elements.text.value); return; }
    const pf = e.target.closest('[data-propose-form]'); if (pf) { e.preventDefault(); propose(pf.dataset.proposeForm, pf.elements.value.value); return; }
    const af = e.target.closest('[data-answer-form]'); if (af) { e.preventDefault(); answer(af.dataset.answerForm, af.elements.answer.value); }
  });
  document.addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const n = e.target.closest && (e.target.closest('[data-sel]') || e.target.closest('[data-q]')); if (!n) return; e.preventDefault(); n.click(); });
  document.getElementById('tree-host').addEventListener('mouseover', e => { const g = e.target.closest('[data-lane]'); const id = g ? g.dataset.lane : null; if (id !== state.hover) set({ hover: id }); });
  document.getElementById('mode-situation').addEventListener('click', () => set({ mode: 'situation', sel: null, exploreVars: null, exploreTree: null }));
  document.getElementById('mode-explore').addEventListener('click', () => { if (!state.tree) return; set({ mode: 'explore', pending: null, sel: null, exploreVars: state.vars.map(v => Object.assign({}, v)), exploreTree: state.tree }); });
  document.getElementById('clear-btn').addEventListener('click', () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} set({ story: '', vars: [], answers: {}, tree: null, pending: null, prevTree: null, sel: null, done: [], note: null, error: '', mode: 'situation', exploreVars: null, exploreTree: null }); });
  document.getElementById('lang-fr').addEventListener('click', () => setLang('fr'));
  document.getElementById('lang-en').addEventListener('click', () => setLang('en'));
  document.getElementById('conn-btn').addEventListener('click', () => { const p = document.getElementById('conn-panel'); p.hidden = !p.hidden; renderConn(); });

  load(); renderConn(); render();
  if (PUBLIC_PROXY_URL) connect();
  else fetch('proxy-url.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => { if (j && j.url) { conn.proxyUrl = j.url; connect(); } }).catch(() => {});
})();
</script>
</body>
</html>
